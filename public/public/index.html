<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050a10;
    --panel:#0a1119;
    --panel-2:#0c141d;
    --raise:#101a25;
    --line:#18242f;
    --line-soft:#121d27;
    --dim:#5d7186;
    --label:#8ba0b4;
    --text:#dbe7f2;
    --cyan:#22d3ee;
    --green:#22c55e;
    --amber:#f59e0b;
    --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 520px at 50% -8%,rgba(34,211,238,.07),transparent 70%),
      linear-gradient(rgba(56,189,248,.032) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,189,248,.032) 1px,transparent 1px);
    background-size:auto,52px 52px,52px 52px;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:26px 24px 80px}

  /* ---------------- header ---------------- */
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
  .logo{
    width:47px;height:47px;flex:none;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(160deg,#0d1b26,#0a1119);
    border:1px solid rgba(34,211,238,.3);
    box-shadow:0 0 30px rgba(34,211,238,.10) inset,0 6px 20px rgba(0,0,0,.4);
  }
  .logo svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;font-size:29px;font-weight:800;letter-spacing:.02em;line-height:1}
  .status{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--green);flex-wrap:wrap}
  .status .sep{color:#2c3d4e}
  .status .who-online{color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2.4s ease-in-out infinite}
  .dot.off{background:var(--red);box-shadow:0 0 9px var(--red)}
  @keyframes pulse{50%{opacity:.3}}
  .spacer{flex:1}

  .tabs{display:flex;gap:5px;padding:6px;border-radius:13px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
  .tab{
    font:inherit;font-size:12px;font-weight:600;letter-spacing:.07em;
    color:var(--dim);text-decoration:none;border-radius:8px;padding:8px 15px;
    transition:color .15s,background .15s;
  }
  .tab:hover{color:var(--text);background:rgba(255,255,255,.035)}
  .tab[aria-current="page"]{background:var(--cyan);color:#04202a;font-weight:800}
  .tab.soon{color:#33465a;cursor:not-allowed}
  .tab.soon:hover{background:none;color:#33465a}

  /* ---------------- board ---------------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
  @media(max-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}}

  .ch{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:10px;min-height:92px;
    display:flex;flex-direction:column;
    transition:border-color .16s,box-shadow .16s,transform .16s;
  }
  .ch:hover{border-color:#243546}
  .ch.occupied{border-color:rgba(34,211,238,.5);box-shadow:0 0 26px rgba(34,211,238,.09)}
  .ch.full{border-color:rgba(239,68,68,.6);box-shadow:0 0 26px rgba(239,68,68,.10)}
  .ch.drop{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);transform:translateY(-2px)}
  .ch.dragging{opacity:.35}

  .ch-head{
    display:flex;align-items:center;gap:9px;padding:10px 11px 9px;
    border-bottom:1px solid transparent;
  }
  .ch.occupied .ch-head,.ch.full .ch-head{border-bottom-color:var(--line-soft)}
  .handle{color:#41576c;cursor:grab;font-size:12px;letter-spacing:-2px;user-select:none;padding-right:2px}
  .handle:hover{color:var(--cyan)}
  .handle:active{cursor:grabbing}
  .ch-name{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--label)}
  .ch.occupied .ch-name,.ch.full .ch-name{color:#fff}

  .pct{
    font:inherit;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;
    cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.05);
  }
  .pct:hover{filter:brightness(1.35)}
  .count{margin-left:auto;font-size:11px;font-weight:700;color:var(--dim)}
  .count.full{color:var(--red)}

  .icon{
    width:20px;height:20px;flex:none;display:grid;place-items:center;
    font:inherit;font-size:11.5px;line-height:1;cursor:pointer;border-radius:6px;
    border:1px solid var(--line);background:var(--raise);color:var(--dim);transition:.15s;
  }
  .icon:hover{color:var(--text);border-color:#2d3f52}
  .add{margin-left:auto;width:22px;height:22px;font-size:13px}
  .add:hover{color:var(--cyan);border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.08)}
  .edit{border-color:rgba(34,211,238,.3);color:var(--cyan)}
  .edit:hover{background:rgba(34,211,238,.14);border-color:var(--cyan)}
  .del{border-color:rgba(239,68,68,.3);color:var(--red)}
  .del:hover{background:rgba(239,68,68,.14);border-color:var(--red)}

  .rows{padding:7px 8px 9px;display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.03)}
  .row:hover{background:rgba(255,255,255,.055)}
  .row.dragging{opacity:.3}
  .pip{
    width:19px;height:19px;flex:none;border-radius:5px;display:grid;place-items:center;
    font-size:9.5px;font-weight:800;color:#04202a;background:var(--cyan);cursor:grab;
  }
  .pip:active{cursor:grabbing}
  .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;cursor:grab}
  .clock{font-size:11px;font-weight:600;color:var(--amber);cursor:pointer}
  .clock.stale{color:var(--red)}
  .row input,.newrow input{
    font:inherit;font-size:12.5px;color:var(--text);background:#04121a;
    border:1px solid var(--cyan);border-radius:5px;padding:4px 7px;
  }
  .row input{flex:1;min-width:0}
  .newrow{padding:0 8px 9px}
  .newrow input{width:100%}
  .newrow input::placeholder{color:#3f556a}

  /* ---------------- burning % popover ---------------- */
  .pctmenu{
    position:fixed;z-index:60;padding:12px;border-radius:12px;
    background:#0a1119;border:1px solid #22303f;box-shadow:0 18px 44px rgba(0,0,0,.7);
  }
  .pctmenu h4{margin:0 0 9px;font:inherit;font-size:10px;font-weight:500;letter-spacing:.18em;color:var(--dim)}
  .pctgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .pctgrid button{font:inherit;font-size:12px;font-weight:800;padding:8px 6px;border-radius:7px;cursor:pointer;min-width:50px}
  .pctgrid button:hover{filter:brightness(1.4)}
  .pctgrid button[aria-current="true"]{box-shadow:0 0 0 1.5px currentColor inset}

  /* ---------------- chat ---------------- */
  .chat{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .chat-head{
    display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line-soft);
    font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--cyan);
  }
  .log{height:clamp(120px,19vh,190px);overflow-y:auto;padding:11px 14px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;line-height:1.55}
  .log::-webkit-scrollbar{width:9px}
  .log::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:9px}
  .log .t{color:#42566a}
  .log .src{color:var(--cyan);font-weight:700}
  .log .src.user{color:var(--green)}
  .log .sep{color:#3a4c5e}
  .log .msg{color:#a9bcce}
  .log .empty{color:var(--dim)}
  .say{display:flex;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--panel-2)}
  .who-btn{font:inherit;font-size:13px;font-weight:800;color:var(--cyan);background:none;border:0;padding:0;cursor:pointer}
  .who-btn:hover{text-decoration:underline}
  .say input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);background:none;border:0;padding:3px 0}
  .say input::placeholder{color:#3f556a}
  .say input:focus{outline:none}

  footer{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .ghost{font:inherit;font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer}
  .ghost:hover{color:var(--text);border-color:#2d3f52}
  .ghost.danger:hover{color:var(--red);border-color:rgba(239,68,68,.5)}
  .row.picked{background:rgba(34,211,238,.16);box-shadow:inset 0 0 0 1px rgba(34,211,238,.55)}
  .ch.target{border-color:rgba(34,211,238,.45);cursor:pointer}
  .ch.target:hover{border-color:var(--cyan);background:rgba(34,211,238,.05)}
  .hint{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;
    display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:999px;
    background:#0a1119;border:1px solid rgba(34,211,238,.6);color:var(--text);
    font-size:12px;box-shadow:0 12px 34px rgba(0,0,0,.7);max-width:calc(100% - 24px);
  }
  .hint button{font:inherit;font-size:11.5px;color:var(--dim);background:none;border:0;cursor:pointer;padding:0}
  .hint button:hover{color:var(--text)}

  @media(max-width:700px){
    .wrap{padding:16px 12px 70px}
    header{gap:12px;margin-bottom:18px}
    h1{font-size:24px}
    .logo{width:40px;height:40px;border-radius:11px}
    .logo svg{width:21px;height:21px}
    .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;padding:5px;-webkit-overflow-scrolling:touch}
    .tab{padding:8px 13px;flex:none}
    .ch{min-height:76px;border-radius:9px}
    .ch-head{padding:8px 9px 7px;gap:7px}
    .ch-name{font-size:11.5px;letter-spacing:.06em}
    .rows{padding:6px 6px 8px}
    .row{padding:5px 7px;gap:6px}
    .who{font-size:12px}
    .pip{display:none}
    footer{margin-top:16px}
  }
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
    <div>
      <h1 id="title">—</h1>
      <div class="status">
        <span class="dot" id="conn"></span>
        <span id="connText">connecting…</span>
        <span class="sep">·</span>
        <span id="refreshed">--:--:--&nbsp;UTC</span>
        <span class="sep">·</span>
        <span class="who-online" id="online">0 watching</span>
      </div>
    </div>
    <div class="spacer"></div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <div class="grid" id="grid"></div>

  <section class="chat">
    <div class="chat-head"><span class="dot"></span><span id="chatTitle">CHAT</span></div>
    <div class="log" id="log"></div>
    <div class="say">
      <span class="dot"></span>
      <button class="who-btn" id="whoBtn" title="Change your display name">Guest</button>
      <span class="sep" style="color:#3a4c5e">·</span>
      <input id="sayInput" placeholder="Message..." maxlength="200" aria-label="Send a message">
    </div>
  </section>

  <footer>
    <span id="tally"></span>
    <div class="spacer"></div>
    <button class="ghost danger" id="clearBoard">Clear board</button>
  </footer>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const CAP = 4;
const socket = io();
const region = decodeURIComponent(location.pathname.replace(/^\/|\/$/g, "")).toUpperCase() || "RD1";

let board = [];
let log = [];
let editing = null;      // {ch, id} | {ch, id:"new"}
let pending = null;      // state that arrived mid-edit
let menuEl = null;
let picked = null;      // {ch, id} or {ch, group:true} — tap-to-move, for touch
let me = "Guest";
try { me = localStorage.getItem("ct:name") || "Guest" } catch (e) {}

/* ---------------- helpers ---------------- */
function pctColor(v){
  if(v>=80) return "#22c55e";
  if(v>=50) return "#eab308";
  if(v>=20) return "#f97316";
  if(v>=10) return "#f4642f";
  return "#ef4444";
}
const chLabel = i => "CH " + String(i+1).padStart(2,"0");
function elapsed(at){
  const m = Math.max(0, Math.floor((Date.now()-at)/60000));
  return m<60 ? m+"m" : Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")+"m";
}
function stamp(ts){
  const d = new Date(ts);
  return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");
}
const send = a => socket.emit("action", Object.assign({by:me}, a));

/* ---------------- socket ---------------- */
socket.on("connect", () => {
  document.getElementById("conn").classList.remove("off");
  document.getElementById("connText").textContent = "live";
  socket.emit("join", region);
});
socket.on("disconnect", () => {
  document.getElementById("conn").classList.add("off");
  document.getElementById("connText").textContent = "reconnecting…";
});
socket.on("denied", msg => { document.getElementById("connText").textContent = msg });

socket.on("hello", info => {
  document.getElementById("title").textContent = info.region;
  document.getElementById("chatTitle").textContent = info.region + " CHAT";
  document.title = info.region + " — Channel Tracker";
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  info.regions.forEach(r => {
    if(r.enabled){
      const a = document.createElement("a");
      a.className = "tab"; a.href = "/" + r.id.toLowerCase(); a.textContent = r.id;
      if(r.id === info.region) a.setAttribute("aria-current","page");
      tabs.appendChild(a);
    } else {
      const s = document.createElement("span");
      s.className = "tab soon"; s.textContent = r.id; s.title = "Not open yet";
      tabs.appendChild(s);
    }
  });
});

socket.on("presence", n => {
  document.getElementById("online").textContent = n + (n === 1 ? " watching" : " watching");
});

socket.on("sync", s => {
  if(editing){ pending = s; return; }
  board = s.channels; log = s.log;
  render();
});
function flush(){ if(pending){ board = pending.channels; log = pending.log; pending = null } }

/* ---------------- board ---------------- */
const grid = document.getElementById("grid");

function render(){
  closeMenu();
  grid.innerHTML = "";
  board.forEach((c,i) => grid.appendChild(card(c,i)));
  const occ = board.filter(c=>c.entries.length).length;
  const ppl = board.reduce((n,c)=>n+c.entries.length,0);
  const full = board.filter(c=>c.entries.length>=CAP).length;
  document.getElementById("tally").textContent =
    `${occ}/${board.length} channels occupied · ${ppl} tracked · ${full} full`;
  renderLog();
  renderHint();
}

function renderHint(){
  const old = document.querySelector(".hint");
  if(old) old.remove();
  if(!picked) return;
  const c = board[picked.ch];
  if(!c) { picked = null; return; }
  const who = picked.group
    ? chLabel(picked.ch) + " (" + c.entries.length + ")"
    : (c.entries.find(e => e.id === picked.id) || {}).name;
  if(!who) { picked = null; return; }
  const h = document.createElement("div");
  h.className = "hint";
  const label = document.createElement("span");
  label.textContent = "Moving " + who + " — tap a channel";
  const cancel = document.createElement("button");
  cancel.textContent = "cancel";
  cancel.onclick = () => { picked = null; render(); };
  h.appendChild(label); h.appendChild(cancel);
  document.body.appendChild(h);
}

function card(c,i){
  const el = document.createElement("div");
  el.className = "ch" + (c.entries.length>=CAP ? " full" : c.entries.length ? " occupied" : "");

  const head = document.createElement("div");
  head.className = "ch-head";

  if(c.entries.length){
    const h = document.createElement("span");
    h.className = "handle"; h.textContent = "⋮⋮"; h.title = "Drag the whole channel";
    h.draggable = true;
    h.ondragstart = e => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"group",from:i}));
      el.classList.add("dragging");
    };
    h.ondragend = () => el.classList.remove("dragging");
    h.onclick = e => {
      e.stopPropagation();
      picked = (picked && picked.group && picked.ch === i) ? null : {ch:i, group:true};
      render();
    };
    head.appendChild(h);
  }

  const nm = document.createElement("span");
  nm.className = "ch-name"; nm.textContent = chLabel(i);
  head.appendChild(nm);

  const p = document.createElement("button");
  p.className = "pct"; p.textContent = c.pct + "%"; p.title = "Set burning %";
  const col = pctColor(c.pct);
  p.style.color = col; p.style.background = col+"20"; p.style.borderColor = col+"55";
  p.onclick = e => { e.stopPropagation(); openPctMenu(p, i) };
  head.appendChild(p);

  if(c.entries.length){
    const cnt = document.createElement("span");
    cnt.className = "count" + (c.entries.length>=CAP ? " full" : "");
    cnt.textContent = c.entries.length + "/" + CAP;
    head.appendChild(cnt);
  }

  if(c.entries.length < CAP){
    const add = document.createElement("button");
    add.className = "icon add"; add.textContent = "+"; add.title = "Add someone to " + chLabel(i);
    add.onclick = () => { editing = {ch:i,id:"new"}; render() };
    head.appendChild(add);
  }
  el.appendChild(head);

  if(c.entries.length){
    const rows = document.createElement("div");
    rows.className = "rows";
    c.entries.forEach(en => rows.appendChild(row(en,i)));
    if(picked && picked.group && picked.ch === i) rows.querySelectorAll(".row").forEach(r => r.classList.add("picked"));
    el.appendChild(rows);
  }

  if(editing && editing.ch===i && editing.id==="new"){
    const box = document.createElement("div");
    box.className = "newrow";
    const inp = document.createElement("input");
    inp.placeholder = "name, then Enter";
    inp.maxLength = 24;
    inp.onblur = () => {
      const v = inp.value.trim();
      editing = null;
      if(v) send({type:"add",ch:i,name:v}); else { flush(); render() }
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ editing=null; flush(); render() }
    };
    box.appendChild(inp); el.appendChild(box);
    setTimeout(()=>inp.focus(),0);
  }

  if(picked && picked.ch !== i) el.classList.add("target");
  el.onclick = e => {
    if(e.target.closest("button") || e.target.closest("input")) return;
    if(!picked || picked.ch === i) return;
    if(picked.group) send({type:"moveGroup", from:picked.ch, to:i});
    else send({type:"moveUser", from:picked.ch, to:i, id:picked.id});
    picked = null;
  };

  el.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect="move"; el.classList.add("drop") };
  el.ondragleave = () => el.classList.remove("drop");
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove("drop");
    let d; try{ d = JSON.parse(e.dataTransfer.getData("text/plain")) }catch(err){ return }
    if(!d || d.from === i) return;
    if(d.kind === "group") send({type:"moveGroup",from:d.from,to:i});
    else send({type:"moveUser",from:d.from,to:i,id:d.id});
  };
  return el;
}

function row(en,ci){
  const r = document.createElement("div");
  r.className = "row";

  const pip = document.createElement("span");
  pip.className = "pip"; pip.textContent = en.name.slice(0,1).toUpperCase();
  r.appendChild(pip);

  if(editing && editing.ch===ci && editing.id===en.id){
    const inp = document.createElement("input");
    inp.value = en.name; inp.maxLength = 24;
    inp.onblur = () => {
      const v = inp.value.trim();
      editing = null;
      if(v && v !== en.name) send({type:"rename",ch:ci,id:en.id,name:v});
      else { flush(); render() }
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ editing=null; flush(); render() }
    };
    r.appendChild(inp);
    setTimeout(()=>{inp.focus();inp.select()},0);
  } else {
    const who = document.createElement("span");
    who.className = "who"; who.textContent = en.name;
    who.draggable = true; who.title = "Drag to another channel";
    who.ondragstart = e => {
      e.stopPropagation();
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"user",from:ci,id:en.id}));
      r.classList.add("dragging");
    };
    who.ondragend = () => r.classList.remove("dragging");
    who.onclick = e => {
      e.stopPropagation();
      picked = (picked && picked.id === en.id) ? null : {ch:ci, id:en.id};
      render();
    };
    if(picked && picked.id === en.id) r.classList.add("picked");
    r.appendChild(who);
    pip.draggable = true;
    pip.ondragstart = who.ondragstart;
    pip.ondragend = who.ondragend;
  }

  const clock = document.createElement("span");
  clock.className = "clock"; clock.dataset.at = en.at; clock.textContent = elapsed(en.at);
  if(Date.now()-en.at > 90*60000) clock.classList.add("stale");
  clock.title = "Click to reset the timer";
  clock.onclick = () => send({type:"timer",ch:ci,id:en.id});
  r.appendChild(clock);

  const ed = document.createElement("button");
  ed.className = "icon edit"; ed.textContent = "✎"; ed.title = "Rename";
  ed.onclick = () => { editing = {ch:ci,id:en.id}; render() };
  r.appendChild(ed);

  const dl = document.createElement("button");
  dl.className = "icon del"; dl.textContent = "✕"; dl.title = "Remove";
  dl.onclick = () => send({type:"remove",ch:ci,id:en.id});
  r.appendChild(dl);
  return r;
}

/* ---------------- burning % popover ---------------- */
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null } }

function openPctMenu(anchor, ci){
  closeMenu();
  const m = document.createElement("div");
  m.className = "pctmenu";
  m.onclick = e => e.stopPropagation();

  const h = document.createElement("h4");
  h.textContent = "BURNING %";
  m.appendChild(h);

  const g = document.createElement("div");
  g.className = "pctgrid";
  for(let v=0; v<=100; v+=10){
    const b = document.createElement("button");
    b.textContent = v + "%";
    const col = pctColor(v);
    b.style.color = col; b.style.background = col+"20"; b.style.border = "1px solid "+col+"59";
    if(v === board[ci].pct) b.setAttribute("aria-current","true");
    b.onclick = () => { closeMenu(); send({type:"pct",ch:ci,pct:v}) };
    g.appendChild(b);
  }
  m.appendChild(g);
  document.body.appendChild(m);

  const r = anchor.getBoundingClientRect();
  let left = Math.min(r.left, window.innerWidth - m.offsetWidth - 12);
  let top = r.bottom + 8;
  if(top + m.offsetHeight > window.innerHeight - 10) top = Math.max(10, r.top - m.offsetHeight - 8);
  m.style.left = Math.max(10,left) + "px";
  m.style.top = top + "px";
  menuEl = m;
}
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  closeMenu();
  if(picked){ picked = null; render() }
});
window.addEventListener("resize", closeMenu);
window.addEventListener("scroll", closeMenu, true);

/* ---------------- chat ---------------- */
const logEl = document.getElementById("log");
function renderLog(){
  const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
  logEl.innerHTML = "";
  if(!log.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nothing yet. Every change to this board shows up here.";
    logEl.appendChild(e);
    return;
  }
  log.forEach(item => {
    const line = document.createElement("div");
    line.innerHTML = '<span class="t"></span> <span class="src"></span> <span class="sep">:</span> <span class="msg"></span>';
    line.querySelector(".t").textContent = "[" + stamp(item.t) + "]";
    const src = line.querySelector(".src");
    src.textContent = item.who ? item.who : region + " System";
    if(item.who) src.classList.add("user");
    line.querySelector(".msg").textContent = item.msg;
    logEl.appendChild(line);
  });
  if(atBottom) logEl.scrollTop = logEl.scrollHeight;
}

const sayInput = document.getElementById("sayInput");
sayInput.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const v = sayInput.value.trim();
  if(!v) return;
  socket.emit("chat", {who:me, text:v});
  sayInput.value = "";
});

const whoBtn = document.getElementById("whoBtn");
whoBtn.textContent = me;
whoBtn.onclick = () => {
  const v = prompt("Display name", me);
  if(v && v.trim()){
    me = v.trim().slice(0,24);
    whoBtn.textContent = me;
    try { localStorage.setItem("ct:name", me) } catch(e){}
  }
};

document.getElementById("clearBoard").onclick = () => {
  if(confirm("Clear every channel on this board for everyone?")) send({type:"clear"});
};

/* ---------------- clocks ---------------- */
setInterval(() => {
  document.getElementById("refreshed").textContent =
    new Date().toISOString().slice(11,19) + " UTC";
  document.querySelectorAll(".clock").forEach(c => {
    const at = +c.dataset.at;
    c.textContent = elapsed(at);
    c.classList.toggle("stale", Date.now()-at > 90*60000);
  });
}, 1000);
</script>
