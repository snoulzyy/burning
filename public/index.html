<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/crying.jpg">
<title>SHIDDAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Quicksand:wght@500;600;700&family=Poppins:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050a10;
    --panel:#0a1119;
    --panel-2:#0c141d;
    --raise:#101a25;
    --line:#18242f;
    --line-soft:#121d27;
    --dim:#5d7186;
    --label:#8ba0b4;
    --text:#dbe7f2;
    --cyan:#22d3ee;
    --green:#22c55e;
    --amber:#f59e0b;
    --red:#ef4444;
    /* how solid the panels are once a background video/image is in play.
       1 = opaque, 0 = fully see-through. Nudge until it reads right. */
    --glass:.62;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;-webkit-font-smoothing:antialiased;
    position:relative;isolation:isolate;
  }

  /* ---------- your own background, if one is on disk ---------- */
  .bgmedia{
    position:fixed;inset:0;width:100%;height:100%;z-index:-4;pointer-events:none;
    object-fit:cover;background-size:cover;background-position:center;
    display:none;opacity:.5;filter:saturate(1.05) contrast(1.02);
  }
  /* the neon eases off so it sits over your media instead of fighting it */
  .has-bg body::after,
  html.has-bg body::after{opacity:.55}
  html.has-bg body::before{opacity:.75}

  /* ---------- live background: dark cyberpunk ---------- */
  /* neon haze — magenta rising from the horizon, cyan and violet overhead */
  body::after{
    content:"";position:fixed;inset:-8%;z-index:-3;pointer-events:none;
    background:
      radial-gradient(1200px 620px at 50% 116%,rgba(236,72,153,.20),transparent 66%),
      radial-gradient(900px 540px at 10% 4%,rgba(34,211,238,.16),transparent 64%),
      radial-gradient(820px 520px at 92% 26%,rgba(168,85,247,.15),transparent 62%),
      radial-gradient(700px 420px at 74% 96%,rgba(56,189,248,.10),transparent 66%);
    animation:haze 30s ease-in-out infinite alternate;
  }
  @keyframes haze{
    0%  {transform:translate3d(0,0,0) scale(1)}
    50% {transform:translate3d(2%,-1.6%,0) scale(1.05)}
    100%{transform:translate3d(-1.8%,1.4%,0) scale(1.02)}
  }
  /* CRT scanlines with a vignette pulling the edges down */
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg,rgba(120,220,255,.030) 0 1px,transparent 1px 3px),
      radial-gradient(130% 105% at 50% 45%,transparent 52%,rgba(0,0,0,.62) 100%);
  }
  /* a light beam drifting across, magenta bleeding into cyan */
  .sheen{
    position:fixed;inset:-45% -20%;z-index:-1;pointer-events:none;
    background:
      linear-gradient(104deg,transparent 40%,rgba(236,72,153,.06) 48%,rgba(34,211,238,.06) 54%,transparent 62%);
    animation:sweep 18s linear infinite;
    will-change:transform;
  }
  @keyframes sweep{
    from{transform:translate3d(-38%,0,0)}
    to{transform:translate3d(38%,0,0)}
  }
  @media(prefers-reduced-motion:reduce){
    body::before,body::after,.sheen{animation:none}
  }

  .wrap{max-width:1560px;margin:0 auto;padding:26px 24px 80px}

  /* ---------------- header ---------------- */
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
  .logo{
    width:47px;height:47px;flex:none;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(160deg,#0d1b26,#0a1119);
    border:1px solid rgba(34,211,238,.3);
    box-shadow:0 0 30px rgba(34,211,238,.10) inset,0 6px 20px rgba(0,0,0,.4);
  }
  .logo svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;font-size:29px;font-weight:800;letter-spacing:.02em;line-height:1}
  .status{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--green);flex-wrap:wrap}
  .status .sep{color:#2c3d4e}
  .status .who-online{color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2.4s ease-in-out infinite}
  .dot.off{background:var(--red);box-shadow:0 0 9px var(--red)}
  @keyframes pulse{50%{opacity:.3}}
  .spacer{flex:1}

  .tabs{display:flex;gap:5px;padding:6px;border-radius:13px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
  .tab{
    font:inherit;font-size:12px;font-weight:600;letter-spacing:.07em;
    color:var(--dim);text-decoration:none;border-radius:8px;padding:8px 15px;
    background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;
    transition:color .15s,background .15s;
  }
  .tab:hover{color:var(--text);background:rgba(255,255,255,.035)}
  .tab[aria-current="page"]{background:var(--cyan);color:#04202a;font-weight:800}
  .tab.soon{color:#33465a;cursor:not-allowed;background:none}
  .tab.soon:hover{background:none;color:#33465a}

  /* ---------------- bench ---------------- */
  .bench{
    position:sticky;top:8px;z-index:30;
    margin-bottom:16px;background:#0b131c;
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .bench.armed{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 1px rgba(34,211,238,.25),0 10px 26px rgba(0,0,0,.5)}
  .bench-head{
    display:flex;align-items:center;gap:12px;padding:9px 13px;
    border-bottom:1px solid var(--line-soft);
  }
  .bench-title{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--cyan)}
  .bench-hint{font-size:10.5px;color:var(--dim)}
  .bench-add{margin-left:auto;font-size:11px;padding:5px 11px}
  .bench-body{
    display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px;padding:11px 13px;
    /* two rows of names, then it scrolls down instead of sideways */
    max-height:82px;overflow-x:hidden;overflow-y:auto;scrollbar-width:thin;
  }
  .bench-body::-webkit-scrollbar{width:7px}
  .bench-body::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:7px}
  .bench-body::-webkit-scrollbar-track{background:transparent}
  .chip{flex:none}
  @media(max-width:700px){.bench-body{max-height:76px;padding:9px 10px}}
  .bench-empty{font-size:11.5px;color:var(--dim);padding:2px 0}

  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 10px;
    border-radius:8px;border:1px solid var(--line);background:var(--raise);
    font-size:12.5px;cursor:grab;transition:.15s;
  }
  .chip:hover{border-color:#2d3f52}
  .chip:active{cursor:grabbing}
  .chip .nm{font-family:var(--name-face);font-weight:600}
  .chip.placed{opacity:.45;cursor:default}
  .chip.placed .where{font-size:10px;color:var(--amber);letter-spacing:.04em}
  .chip.mine{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.08)}
  .chip.mine.tinted{box-shadow:0 0 0 1px rgba(255,255,255,.35), 0 0 14px -2px var(--glow)}
  .chip.picked{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .chip-btn{
    width:18px;height:18px;flex:none;display:grid;place-items:center;padding:0;
    border-radius:5px;border:1px solid transparent;background:none;
    color:var(--dim);cursor:pointer;line-height:0;
  }
  .chip-btn svg{width:11px;height:11px;display:block}
  .chip-btn:hover{color:var(--text);border-color:var(--line)}
  .chip.mine .claim{color:var(--cyan)}
  .chip-btn.locked{color:#4a5f74;cursor:not-allowed}
  .chip-btn.locked:hover{color:#4a5f74;border-color:transparent}
  .claimtag{
    font-size:9.5px;letter-spacing:.04em;color:var(--amber);
    max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .claimtag.me{color:var(--cyan);font-weight:700}
  .chip-btn.swatch{
    width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
    padding:0;flex:none;cursor:pointer;
  }
  .chip-btn.swatch:hover{border-color:#fff}
  .colmenu{
    position:fixed;z-index:60;padding:10px;border-radius:12px;
    background:#0a1119;border:1px solid #22303f;box-shadow:0 18px 44px rgba(0,0,0,.7);
  }
  .colmenu h4{margin:0 0 8px;font:inherit;font-size:9.5px;font-weight:500;letter-spacing:.16em;color:var(--dim)}
  .colgrid{display:grid;grid-template-columns:repeat(6,22px);gap:6px}
  .colgrid button{
    width:22px;height:22px;border-radius:6px;cursor:pointer;
    border:1px solid rgba(255,255,255,.2);padding:0;
  }
  .colgrid button:hover{transform:scale(1.12)}
  .colgrid button.on{box-shadow:0 0 0 2px #fff inset}
  .colcustom{display:flex;align-items:center;gap:6px;margin-top:9px}
  .colcustom input[type=color]{
    width:34px;height:28px;padding:0;cursor:pointer;background:none;
    border:1px solid var(--line);border-radius:6px;
  }
  .colcustom input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  .colcustom input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
  .hexbox{
    flex:1;min-width:0;width:88px;font:inherit;font-size:11.5px;padding:6px 8px;
    color:var(--text);background:#04121a;border:1px solid var(--line);border-radius:6px;
  }
  .hexbox:focus{outline:none;border-color:var(--cyan)}
  .chip .drop-btn:hover{color:var(--red);border-color:rgba(239,68,68,.45)}
  @media(max-width:700px){.bench-hint{display:none}}

  /* ---------------- next up (floats over the board) ---------------- */
  .nextmenu{
    position:fixed;z-index:60;width:246px;padding:9px;border-radius:12px;
    background:#0a1119;border:1px solid rgba(167,139,250,.45);
    box-shadow:0 18px 44px rgba(0,0,0,.7), 0 0 16px -6px rgba(167,139,250,.8);
  }
  .nextmenu .mhead{display:flex;align-items:center;gap:8px;margin:0 0 8px}
  .nextmenu h4{margin:0;font:inherit;font-size:9.5px;font-weight:600;letter-spacing:.16em;color:#c4b5fd}
  .grp{display:flex;align-items:center;gap:3px;margin-left:auto}
  .grp span{font-size:10px;color:var(--dim);letter-spacing:.06em}
  .grp b{font-size:11.5px;color:var(--text);min-width:12px;text-align:center}
  .grp button{
    width:17px;height:17px;display:grid;place-items:center;padding:0;line-height:0;
    font:inherit;font-size:12px;color:var(--dim);cursor:pointer;
    background:var(--raise);border:1px solid var(--line);border-radius:4px;
  }
  .grp button:hover{color:var(--cyan);border-color:rgba(34,211,238,.5)}
  .n-soon{margin-left:auto;font-size:10px;color:var(--amber);white-space:nowrap}
  .next-row.soon{opacity:.9}
  .next-row.soon .n-ch{color:var(--amber)}
  .next-body{
    display:flex;flex-direction:column;max-height:300px;overflow-y:auto;overscroll-behavior:contain;
  }
  .next-body::-webkit-scrollbar{width:7px}
  .next-body::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:7px}
  .next-body::-webkit-scrollbar{width:7px}
  .next-body::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:7px}
  .next-row{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
    background:none;border:1px solid transparent;cursor:pointer;font:inherit;text-align:left;
  }
  .next-row:hover{background:rgba(167,139,250,.12);border-color:rgba(167,139,250,.4)}
  .next-row .n-ch{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text)}
  .next-row .n-pct{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px}
  .next-row .n-slots{font-size:10px;color:var(--dim);margin-left:6px}
  .next-row .n-tick{
    margin-left:auto;font-size:9.5px;font-weight:700;color:#4ade80;
    white-space:nowrap;text-align:right;
  }
  .next-row .n-tick.flat{color:var(--dim)}
  .next-row .n-tick.frozen{color:#93c5fd}
  .next-row .n-go{display:grid;place-items:center;color:var(--dim);line-height:0;margin-left:2px}
  .next-row .n-go svg{width:11px;height:11px;display:block}
  .next-row:hover .n-go{color:#c4b5fd}
  .next-row .n-soon{margin-left:6px}
  .curfew{
    margin:-2px 0 8px;padding:5px 7px;border-radius:6px;
    font-size:9.5px;letter-spacing:.05em;color:#93c5fd;
    background:rgba(96,165,250,.10);border:1px solid rgba(96,165,250,.28);
  }
  .next-empty{padding:10px 9px;font-size:11px;color:var(--dim);line-height:1.5}
  .movebar{
    display:grid;place-items:center;
    width:calc(100% - 16px);margin:0 8px 9px;height:26px;padding:0;
    border-radius:7px;border:1px solid rgba(167,139,250,.5);
    background:linear-gradient(140deg,rgba(167,139,250,.18),rgba(236,72,153,.14));
    color:#c4b5fd;cursor:pointer;line-height:0;transition:.15s;
    box-shadow:0 0 10px -4px rgba(167,139,250,.9);
  }
  .movebar:hover{
    color:#e9d5ff;border-color:#a78bfa;
    background:linear-gradient(140deg,rgba(167,139,250,.34),rgba(236,72,153,.26));
    box-shadow:0 0 14px -2px rgba(167,139,250,1);
  }
  .movebar svg{width:13px;height:13px;display:block}
  .mvpbtn{
    flex:none;margin-right:10px;padding:8px 15px;border-radius:9px;cursor:pointer;
    font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.14em;line-height:1.2;
    color:#fecdd3;border:1px solid rgba(244,63,94,.55);
    background:linear-gradient(140deg,rgba(244,63,94,.24),rgba(249,115,22,.18));
    box-shadow:0 0 8px -3px rgba(244,63,94,.9);
    transition:.15s;
  }
  .mvpbtn:hover{
    color:#fff;border-color:#fb7185;
    background:linear-gradient(140deg,rgba(244,63,94,.45),rgba(249,115,22,.34));
    box-shadow:0 0 12px -2px rgba(244,63,94,1);
  }
  .mvpbtn.fired{animation:mvpFire .45s ease-in-out 2}
  @keyframes mvpFire{
    0%,100%{transform:scale(1);box-shadow:0 0 10px -3px rgba(244,63,94,.9)}
    50%    {transform:scale(1.14);box-shadow:0 0 18px 0 rgba(244,63,94,1)}
  }
  .durbtn{
    width:19px;height:19px;flex:none;display:grid;place-items:center;padding:0;
    border-radius:5px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.08);
    color:var(--amber);cursor:pointer;line-height:0;transition:.15s;
  }
  .durbtn:hover{background:rgba(245,158,11,.2);border-color:var(--amber)}
  .durbtn svg{width:12px;height:12px;display:block}
  .durmenu{
    position:fixed;z-index:60;padding:11px;border-radius:12px;
    background:#0a1119;border:1px solid #22303f;box-shadow:0 18px 44px rgba(0,0,0,.7);
  }
  .durmenu h4{margin:0 0 8px;font:inherit;font-size:9.5px;font-weight:500;letter-spacing:.16em;color:var(--dim)}
  .durgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  .durgrid button{
    font:inherit;font-size:11.5px;font-weight:700;padding:7px 5px;min-width:46px;
    border-radius:6px;cursor:pointer;color:var(--amber);
    background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);
  }
  .durgrid button:hover{background:rgba(245,158,11,.25);border-color:var(--amber)}
  .durcustom{display:flex;gap:5px;margin-top:8px}
  .durcustom input{
    flex:1;min-width:0;font:inherit;font-size:12px;padding:6px 8px;
    color:var(--text);background:#04121a;border:1px solid var(--line);border-radius:6px;
  }
  .durcustom input:focus{outline:none;border-color:var(--amber)}
  .durcustom button{
    font:inherit;font-size:11.5px;font-weight:700;padding:0 11px;cursor:pointer;
    color:var(--amber);background:rgba(245,158,11,.12);
    border:1px solid rgba(245,158,11,.35);border-radius:6px;
  }
  .ch.flash{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.5)}

/* ---------------- board ---------------- */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  @media(max-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:940px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
  @media(max-width:360px){.grid{grid-template-columns:1fr}}

  .ch{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:10px;min-height:92px;
    display:flex;flex-direction:column;
    transition:border-color .16s,box-shadow .16s,transform .16s;
  }
  .ch:hover{border-color:#243546}
  .ch.occupied{border-color:rgba(34,211,238,.5);box-shadow:0 0 26px rgba(34,211,238,.09)}
  /* no gif on disk? fall back to a flowing gradient ring */
  .firering{
    position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;padding:12px;
    background:linear-gradient(112deg,#f97316,#ef4444 28%,#fbbf24 52%,#f97316 74%,#ea580c);
    animation:ringPulse 2.8s ease-in-out infinite;
    will-change:opacity;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  @keyframes ringPulse{0%,100%{opacity:.82}50%{opacity:1}}
  @media(max-width:700px){.firering{padding:8px}}
  .many-fires .firering{padding:8px;opacity:.72}

  /* ---------- a full channel is on fire ---------- */
  .ch.full{
    position:relative;overflow:hidden;
    border-color:rgba(249,115,22,.75);
    box-shadow:0 0 22px -6px rgba(249,115,22,.6);
  }
  .ch.full > *:not(.firering){position:relative;z-index:1}
  .ch.full .ch-head{background:transparent;border-bottom-color:transparent}
  .ch.full .count.full{color:#fdba74;text-shadow:0 0 8px rgba(249,115,22,.8);animation:countFlare 1.7s ease-in-out infinite}
  @keyframes countFlare{0%,100%{opacity:.85}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){
    .ch.full .count.full,.firering{animation:none}
  }
  .ch.drop{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);transform:translateY(-2px)}
  .ch.dragging{opacity:.35}

  .ch-head{
    display:flex;align-items:center;gap:9px;padding:10px 11px 9px;
    border-bottom:1px solid transparent;
  }
  .ch.occupied .ch-head,.ch.full .ch-head{border-bottom-color:var(--line-soft)}
  .handle{
    display:grid;place-items:center;width:15px;height:22px;flex:none;
    color:var(--amber);opacity:.8;cursor:grab;user-select:none;transition:opacity .15s;
  }
  .handle:hover{opacity:1}
  .handle svg{width:11px;height:17px;display:block}
  .handle:active{cursor:grabbing}
  .ch-name{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--label);white-space:nowrap;flex:none}
  .ch.occupied .ch-name,.ch.full .ch-name{color:#fff}

  .pct{
    font:inherit;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;
    cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.05);
  }
  .pct:hover{filter:brightness(1.35)}
  .count{font-size:11px;font-weight:700;color:var(--dim);flex:none}
  .logfilter{display:inline-flex;gap:3px;margin-left:12px}
  .logfilter button{
    font:inherit;font-size:10px;font-weight:600;letter-spacing:.08em;
    color:var(--dim);background:none;border:1px solid transparent;
    border-radius:6px;padding:3px 9px;cursor:pointer;transition:.15s;
  }
  .logfilter button:hover{color:var(--text);background:rgba(255,255,255,.04)}
  .logfilter button[aria-pressed="true"]{
    color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.10);
  }
  @media(max-width:700px){.tip{display:none}}
  .tip{margin-left:auto;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--dim);white-space:nowrap;flex:none}
  .tip code{color:var(--cyan);font-size:10.5px}
  .toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;
    padding:9px 15px;border-radius:999px;background:#0a1119;color:var(--text);
    border:1px solid rgba(34,211,238,.6);font-size:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.7);max-width:calc(100% - 24px);
  }

<script src="/socket.io/socket.io.js"></script>
<script>
const CAP = 4;
const socket = io();
let region = decodeURIComponent(location.pathname.replace(/^\/|\/$/g, "")).toUpperCase() || "RD1";
let regionList = [];

let boards = {};        // region -> channels
let logs = {};          // region -> activity log
let chat = [];          // one chat, shared by every region
let rosters = {};       // area -> people list (RD boards share one, GOB another)
let areaOf = {};        // region -> area
let pickedPerson = null;
let myIds = new Set();  // people claimed by this browser, worked out from the server list
let myToken = "";
try {
  myToken = localStorage.getItem("ct:token") || "";
  if(!myToken){
    myToken = "t" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("ct:token", myToken);
  }
} catch(e){
  myToken = "t" + Math.random().toString(36).slice(2);
}
const PALETTE = ["#22d3ee","#2dd4bf","#22c55e","#a3e635","#eab308","#f59e0b",
                 "#f97316","#ef4444","#f472b6","#a855f7","#60a5fa","#dbe7f2"];
let colorOf = {};       // pid -> colour, rebuilt whenever the roster arrives

let colorByName = {};   // lowercase name -> colour, for chat lines

function hexRGB(hex){
  const h = (hex || "").replace("#", "");
  if(h.length !== 6) return null;
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}
// how bright a colour reads to the eye, 0 (black) to 1 (white)
function luminance(hex){
  const c = hexRGB(hex);
  if(!c) return 0;
  const f = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v + .055)/1.055, 2.4) };
  return .2126*f(c.r) + .7152*f(c.g) + .0722*f(c.b);
}
// black on light colours, near-white on dark ones — always legible
const inkOn = hex => luminance(hex) > .42 ? "#0a1119" : "#f2f8fd";
function hexHSL(hex){
  const c = hexRGB(hex);
  if(!c) return { h:0, s:0, l:.5 };
  const r = c.r/255, g = c.g/255, b = c.b/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0;
  if(d){
    if(mx === r)      h = ((g - b)/d) % 6;
    else if(mx === g) h = (b - r)/d + 2;
    else              h = (r - g)/d + 4;
    h *= 60; if(h < 0) h += 360;
  }
  const l = (mx + mn)/2;
  const sat = d ? d / (1 - Math.abs(2*l - 1)) : 0;
  return { h, s:sat, l };
}
// three neighbouring shades, so the aura has depth instead of one flat colour
function auraRamp(hex){
  const { h, s, l } = hexHSL(hex);
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  return [
    hslHex(h - 14, cl(s * .92, .18, .95), cl(l * .72, .14, .70)),
    hex,
    hslHex(h + 14, cl(s * .90, .18, .95), cl(l * 1.18, .32, .78))
  ];
}

// the colour itself, lifted until it reads against a dark pill
function glowInk(hex){
  const l = luminance(hex);
  if(l >= .34) return hex;
  return mixHex(hex, Math.min(.62, (.34 - l) * 1.9));
}
// nudge a colour toward white (t>0) or black (t<0)
function mixHex(hex, t){
  const c = hexRGB(hex);
  if(!c) return hex;
  const target = t >= 0 ? 255 : 0;
  const k = Math.abs(t);
  const m = v => Math.round(v + (target - v) * k);

function placeStickers(){
  const head  = document.getElementById("stickHead");

  [head, foot, layer].forEach(el => { if(el) el.innerHTML = "" });

      el.style.transform = (i % 2 ? "scaleX(-1) " : "") + "rotate(" + ((i%3)-1)*7 + "deg)";

  const gutter = (window.innerWidth - 1560) / 2;
  if(gutter < 74) return;                       // too tight — skip the swarm
  const cap = Math.min(STICKER_MAX, gutter - 14);

  ["left","right"].forEach((side, sideIdx) => {
    for(let i = 0; i < STICKER_PER_SIDE; i++){
      const seed = i * 7 + sideIdx * 13;
      const w = Math.round(STICKER_MIN + ((seed * 37) % 100) / 100 * (cap - STICKER_MIN));
      const el = stickerImg(pick(seed), w);
      el.style.top = (1 + i * (97 / STICKER_PER_SIDE) + ((seed * 11) % 5)) + "%";
      const inset = 6 + ((seed * 23) % Math.max(1, Math.floor(gutter - w - 6)));

      el.style.animationDelay = ((seed * 29) % 60) / 10 + "s";

// Colour ramps smoothly with the value: 0% red -> 50% yellow -> 100% green.
function pctColor(v){
  const pct = Math.max(0, Math.min(100, v));
  return hslHex(pct * 1.2, 0.82, 0.52);
}
function hslHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  let r=0, g=0, b=0;
  if(h < 60)       { r=c; g=x; }
  else if(h < 120) { r=x; g=c; }
  else if(h < 180) { g=c; b=x; }
  else if(h < 240) { g=x; b=c; }
  else if(h < 300) { r=x; b=c; }
  else             { r=c; b=x; }
  const hex = n => Math.round((n + m) * 255).toString(16).padStart(2, "0");
  return "#" + hex(r) + hex(g) + hex(b);
}
const chLabel = i => "CH " + String(i+1).padStart(2,"0");
function ago(at){
  const m = Math.floor((Date.now()-at)/60000);
  if(m < 1)  return "just now";
  if(m < 60) return m + "m ago";
  const h = Math.floor(m/60);
  return h < 24 ? h + "h ago" : Math.floor(h/24) + "d ago";
}
function elapsed(at){
  const m = Math.max(0, Math.floor((Date.now()-at)/60000));
  return m<60 ? m+"m" : Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")+"m";
}
function stamp(ts){
  const d = new Date(ts);
  return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");
}

async function loadEmotes(){
  if(!SEVENTV_SET) return;

    if(!res.ok) { console.warn("7TV: set not found (" + res.status + ")"); return; }

      const pick = files.find(f => f.name === "2x.webp")
                || files.find(f => f.name === "1x.webp")
                || files.find(f => /\.webp$/.test(f.name))

      emotes[e.name] = (host.url.startsWith("//") ? "https:" : "") + host.url + "/" + pick.name;

function audioReady(){

function primeAudio(){

function beep(startAt){
  const notes = [880, 1174.7, 1568];
  notes.forEach((f, i) => {
    const t = startAt + i * 0.13;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.36);
  });
}
// two-tone, four bursts — deliberately different from the timer chime
function mvpAlarm(){
  if(!soundOn) return;
  primeAudio();
  if(!audioCtx || audioCtx.state !== "running"){
    pendingAlarm = true;
    showAudioBanner();
    return;
  }
  const now = audioCtx.currentTime;
  for(let i = 0; i < 4; i++){
    [1046.5, 1396.9].forEach((f, j) => {
      const t = now + i * 0.34 + j * 0.16;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.18);
    });
  }
}

function alarm(){
  if(!soundOn) return;
  primeAudio();
  // locked audio can't play now — remember it and fire the moment they interact
  if(!audioCtx || audioCtx.state !== "running"){
    pendingAlarm = true;
    showAudioBanner();
    return;
  }
  const now = audioCtx.currentTime;
  // three bursts, so it's hard to miss from across the room
  [0, 1.1, 2.2].forEach(off => beep(now + off));
}

/* ---------------- projected burning ----------------
   An empty channel climbs 10% an hour, from whichever is more recent:
     - the last confirmed reading someone punched in, or
     - the moment the last person left, which costs 10% straight away
   The clock stops during curfew, 22:00–08:00 UTC (the -2 to +8 window),
   and burning never slides back down while frozen.
   ------------------------------------------------------------------ */
const CURFEW_START = 22;   // UTC hour the climb stops
const CURFEW_END   = 8;    // UTC hour it starts again
const LEAVE_LOSS   = 10;   // % knocked off as the last person walks
const HOURLY_GAIN  = 10;   // % gained per active hour while empty

// milliseconds between two times that actually count, curfew removed
function activeMsBetween(from, to){
  if(to <= from) return 0;
  let total = 0;
  const day = 86400000;
  let cursor = new Date(from);
  cursor.setUTCHours(0, 0, 0, 0);
  for(let guard = 0; guard < 400 && cursor.getTime() < to; guard++){
    const dayStart = cursor.getTime();
    const winStart = dayStart + CURFEW_END * 3600000;      // 08:00 UTC
    const winEnd   = dayStart + CURFEW_START * 3600000;    // 22:00 UTC
    const a = Math.max(from, winStart);
    const b = Math.min(to, winEnd);
    if(b > a) total += b - a;
    cursor = new Date(dayStart + day);
  }
  return total;
}

// walk forward from a moment until enough *active* time has passed, skipping curfew
function whenActiveReached(start, neededMs){
  let cur = start, left = neededMs;
  for(let guard = 0; guard < 400 && left > 0; guard++){
    const d = new Date(cur); d.setUTCHours(0,0,0,0);
    const dayStart = d.getTime();
    const winStart = dayStart + CURFEW_END * 3600000;
    const winEnd   = dayStart + CURFEW_START * 3600000;
    if(cur < winStart) cur = winStart;
    if(cur >= winEnd){ cur = dayStart + 86400000 + CURFEW_END * 3600000; continue; }
    const avail = winEnd - cur;
    if(left <= avail) return cur + left;
    left -= avail;
    cur = dayStart + 86400000 + CURFEW_END * 3600000;
  }
  return null;
}

// how long until this channel ticks up another 10%
function nextTick(c){
  const proj = projectedPct(c);
  if(proj === null) return null;
  if(proj >= 100) return { max:true };
  const anchor = anchorOf(c);
  if(!anchor) return null;
  const done = activeMsBetween(anchor, Date.now());
  const needed = (Math.floor(done / 3600000) + 1) * 3600000 - done;
  const at = whenActiveReached(Date.now(), needed);
  if(!at) return null;
  return { at, in: at - Date.now(), frozen: inCurfew() };
}

// short form for a countdown: 35m, 2h 10m
function until(ms){
  const mins = Math.max(0, Math.round(ms / 60000));
  if(mins < 60) return mins + "m";
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? h + "h " + m + "m" : h + "h";
}

// the moment the clock started: whichever reading is more recent
function anchorOf(c){
  const left = c.emptiedAt || 0, set = c.pctAt || 0;
  const a = Math.max(left, set);
  return a || null;
}

// what a channel is probably sitting at right now
function projectedPct(c){
  if(!c || c.entries.length) return null;          // someone's on it, they can see the real number

  const anchor = anchorOf(c);
  if(!anchor) return null;                         // nothing to measure from
  const left = c.emptiedAt || 0, set = c.pctAt || 0;
  const start = (left >= set) ? c.pct - LEAVE_LOSS : c.pct;   // leave penalty, if that's the anchor
  // it steps up on the hour, it doesn't creep — 80% holds at 80% until the tick
  const hours = Math.floor(activeMsBetween(anchor, Date.now()) / 3600000);
  return Math.max(0, Math.min(100, start + HOURLY_GAIN * hours));
}

// true while the clock is inside the freeze window
function inCurfew(d){
  const h = (d || new Date()).getUTCHours();
  return h >= CURFEW_START || h < CURFEW_END;
}

/* ---------------- next up ----------------
   Channels worth moving to: must have room, ranked by burning % first,
   emptier ones ahead of busier ones at the same percentage.
   -------------------------------------------------------------------------- */
let groupCount = 3;           // how many groups you're placing = how many channels to show
try { groupCount = Math.min(10, Math.max(1, parseInt(localStorage.getItem("ct:groups"), 10) || 3)) } catch(e){}
function setGroupCount(n, anchor, fromIdx){
  groupCount = Math.min(10, Math.max(1, n));
  try { localStorage.setItem("ct:groups", groupCount) } catch(e){}
  openNextMenu(anchor, fromIdx);
}

const FREEING_MINUTES = 35;   // a full channel this old counts as "about to open"
const BLOCK_SIZE = 20;        // maps come in runs of 20 channels
const blockOf = i => (typeof i === "number" && i >= 0) ? Math.floor(i / BLOCK_SIZE) : -1;

function rankChannels(skipIdx){
  const now = Date.now();
  return board
    .map((c, idx) => {
      const oldest = c.entries.length
        ? Math.max(...c.entries.map(e => now - e.at))
        : 0;
      const proj = projectedPct(c);
      return {
        idx,
        pct: proj === null ? c.pct : proj,
        shown: c.pct,
        proj,
        taken: c.entries.length,
        mins: Math.floor(oldest / 60000),
        soon: c.entries.length >= CAP && oldest >= FREEING_MINUTES * 60000
      };
    })
    .filter(c => c.idx !== skipIdx && (c.taken < CAP || c.soon))
    .map(c => ({
      ...c,
      // same block of 20 as where you are now, then whichever is nearest
      sameBlock: blockOf(c.idx) === blockOf(skipIdx) ? 0 : 1,
      dist: Math.abs(c.idx - skipIdx)
    }))
    .sort((a, b) =>
      (b.pct - a.pct) ||
      (a.sameBlock - b.sameBlock) ||
      (a.taken - b.taken) ||
      (b.mins - a.mins) ||
      (a.dist - b.dist) ||
      (a.idx - b.idx))
    .slice(0, groupCount);
}

/* ---------------- the bench ---------------- */
const benchEl = document.getElementById("bench");

// where is this person right now, across every region?
const myArea = () => areaOf[region] || "RD";
const regionsHere = () => Object.keys(boards).filter(r => areaOf[r] === myArea());

function placementOf(pid){
  for(const r of regionsHere()){
    const chans = boards[r] || [];
    for(let i = 0; i < chans.length; i++){
      if(chans[i].entries.some(e => e.pid === pid)) return { region: r, idx: i };
    }
  }
  return null;
}

function lockSVG(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>';
}

function personSVG(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>';
}

function renderBench(){
  if(!benchEl) return;
  const roster = rosters[myArea()] || [];
  benchEl.innerHTML = "";
  document.querySelector(".bench-title").textContent = myArea() + " PEOPLE";
  if(!roster.length){
    const e = document.createElement("div");
    e.className = "bench-empty";
    e.textContent = "No one here yet — hit “add person” to put names in.";
    benchEl.appendChild(e);
    return;
  }

  roster.forEach(p => {
    const at = placementOf(p.id);
    const chip = document.createElement("div");
    chip.className = "chip"
      + (at ? " placed" : "")
      + (myIds.has(p.id) ? " mine" : "")
      + (pickedPerson === p.id ? " picked" : "");

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = p.name;
    if(p.color){
      const plit = glowInk(p.color);
      const [pa, pb, pc] = auraRamp(p.color);
      chip.classList.add("tinted");
      chip.style.setProperty("--a1", rgba(pa, .30));
      chip.style.setProperty("--a2", rgba(pb, .13));
      chip.style.setProperty("--a3", rgba(pc, .28));
      chip.style.setProperty("--e1", rgba(pa, .85));
      chip.style.setProperty("--e2", rgba(plit, .95));
      chip.style.setProperty("--e3", rgba(pc, .85));
      chip.style.setProperty("--glow", rgba(plit, .42));
      nm.style.color = plit;
      nm.style.fontWeight = "700";
    }
    chip.appendChild(nm);

    if(at){
      const w = document.createElement("span");
      w.className = "where";
      w.textContent = at.region + " " + chLabel(at.idx).replace("CH ", "CH");
      if(p.color){ w.style.color = glowInk(p.color); w.style.opacity = ".8" }
      chip.appendChild(w);
    } else {
      chip.draggable = true;
      chip.ondragstart = ev => {
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", JSON.stringify({ kind:"person", pid:p.id }));
      };
      chip.onclick = ev => {
        if(ev.target.closest("button")) return;
        pickedPerson = (pickedPerson === p.id) ? null : p.id;
        picked = null;
        renderBench(); render();
      };
    }

    // "this is me" — one browser only, and everyone can see who took it
    const mine = myIds.has(p.id);
    const takenBySomeoneElse = !!p.claimedBy && !mine;

    if(p.claimedBy){
      const tag = document.createElement("span");
      tag.className = "claimtag" + (mine ? " me" : "");
      tag.textContent = mine ? "you" : (p.claimedName || "claimed");
      if(p.color){
        tag.style.color = glowInk(p.color);
        tag.style.opacity = ".85";
      }
      chip.appendChild(tag);
    }

    const btnInk = p.color ? glowInk(p.color) : null;
    const btnEdge = btnInk ? rgba(btnInk, .5) : "transparent";

    const dot = document.createElement("button");
    dot.className = "chip-btn swatch";
    if(btnInk) dot.style.borderColor = btnEdge;
    dot.style.background = p.color || "#44586c";
    dot.title = "Pick a colour for " + p.name;
    dot.onclick = ev => { ev.stopPropagation(); openColorMenu(dot, p); };
    chip.appendChild(dot);

    const claim = document.createElement("button");
    claim.className = "chip-btn claim" + (mine ? " on" : "") + (takenBySomeoneElse ? " locked" : "");
    claim.innerHTML = takenBySomeoneElse ? lockSVG() : personSVG();
    if(btnInk){
      claim.style.color = btnInk;
      claim.style.opacity = takenBySomeoneElse ? ".65" : "1";
      claim.style.borderColor = "transparent";
    }
    claim.title = mine
      ? "This is you — click to release it"
      : takenBySomeoneElse
        ? "Already claimed by " + (p.claimedName || "someone else")
        : "Mark as you (for alerts)";
    claim.onclick = ev => {
      ev.stopPropagation();
      if(takenBySomeoneElse){
        toast(p.name + " is already claimed by " + (p.claimedName || "someone else"), true);
        return;
      }
      if(mine){
        myClaimNames.delete(p.name.trim().toLowerCase());
        saveClaimNames();
        send({ type:"unclaim", pid:p.id, token:myToken });
      } else {
        myClaimNames.add(p.name.trim().toLowerCase());
        saveClaimNames();
        send({ type:"claim", pid:p.id, token:myToken, who:me });
        try { if(window.Notification && Notification.permission === "default") Notification.requestPermission() } catch(e){}
      }
    };
    chip.appendChild(claim);

    if(!at && (!p.claimedBy || mine)){
      const del = document.createElement("button");
      del.className = "chip-btn drop-btn";
      del.innerHTML = crossSVG();
      if(btnInk){ del.style.color = btnInk; del.style.opacity = ".8"; }
      del.title = "Remove " + p.name + " from the list";
      del.onclick = ev => {
        ev.stopPropagation();
        if(confirm("Remove " + p.name + " from the people list?")){
          send({ type:"person-remove", id:p.id, token:myToken });
        }
      };
      chip.appendChild(del);
    }

    benchEl.appendChild(chip);
  });

  document.querySelector(".bench").classList.toggle("armed", !!pickedPerson);
  document.getElementById("benchHint").textContent = pickedPerson
    ? "now click the channel to put them on"
    : "click a name, then click a channel";
}

document.getElementById("benchAdd").onclick = () => {
  const v = prompt("Name to add");
  const name = (v || "").trim().slice(0,24);
  if(!name) return;
  if(name.toLowerCase() === "guest"){
    toast("“Guest” can't go in the people box — it's fine to just stay a guest", true);
    return;
  }
  send({ type:"person-add", name });
};

/* ---------------- board ---------------- */
const grid = document.getElementById("grid");

function render(){
  closeMenu();
  grid.innerHTML = "";
  board.forEach((c,i) => grid.appendChild(card(c,i)));
  const fullCount = board.filter(c => c.entries.length >= CAP).length;
  document.documentElement.classList.toggle("many-fires", fullCount > 10);

  const occ = board.filter(c=>c.entries.length).length;
  const ppl = board.reduce((n,c)=>n+c.entries.length,0);
  const full = board.filter(c=>c.entries.length>=CAP).length;
  document.getElementById("tally").textContent =
    `${occ}/${board.length} channels occupied · ${ppl} tracked · ${full} full`;
  renderLog();
  renderHint();
  renderBench();
}

function renderHint(){
  const old = document.querySelector(".hint");
  if(old) old.remove();
  if(!picked) return;
  const c = board[picked.ch];
  if(!c) { picked = null; return; }
  const who = picked.group
    ? chLabel(picked.ch) + " (" + c.entries.length + ")"
    : (c.entries.find(e => e.id === picked.id) || {}).name;
  if(!who) { picked = null; return; }
  const h = document.createElement("div");
  h.className = "hint";
  const label = document.createElement("span");
  label.textContent = "Moving " + who + " — tap a channel";
  const cancel = document.createElement("button");
  cancel.textContent = "cancel";
  cancel.onclick = () => { picked = null; render(); };
  h.appendChild(label); h.appendChild(cancel);
  document.body.appendChild(h);
}

function card(c,i){
  const el = document.createElement("div");
  el.className = "ch" + (c.entries.length>=CAP ? " full" : c.entries.length ? " occupied" : "")
;

  const head = document.createElement("div");
  head.className = "ch-head";

  if(c.entries.length){
    const h = document.createElement("span");
    h.className = "handle"; h.innerHTML = gripSVG(); h.title = "Drag the whole channel";
    h.draggable = true;
    h.ondragstart = e => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"group",from:i}));
      el.classList.add("dragging");
    };
    h.ondragend = () => el.classList.remove("dragging");
    h.onclick = e => {
      e.stopPropagation();
      picked = (picked && picked.group && picked.ch === i) ? null : {ch:i, group:true};
      render();
    };
    head.appendChild(h);
  }

  const nm = document.createElement("span");
  nm.className = "ch-name"; nm.textContent = chLabel(i);
  head.appendChild(nm);

  const p = document.createElement("button");
  p.className = "pct"; p.textContent = c.pct + "%"; p.title = "Set burning %";
  const col = pctColor(c.pct);
  p.style.color = col; p.style.background = col+"20"; p.style.borderColor = col+"55";
  p.onclick = e => { e.stopPropagation(); openPctMenu(p, i) };
  head.appendChild(p);

  if(c.entries.length){
    const dur = document.createElement("button");
    dur.className = "durbtn";
    dur.innerHTML = clockSVG();
    dur.title = "Set how long this channel has really been going";
    dur.onclick = e => { e.stopPropagation(); openDurationMenu(dur, i); };
    head.appendChild(dur);
  }

  if(c.pctAt){
    const t = document.createElement("span");
    t.className = "ago"; t.dataset.at = c.pctAt;
    t.textContent = ago(c.pctAt).replace(" ago", "");
    t.title = "burning % last changed " + ago(c.pctAt);
    head.appendChild(t);
  }

  const grow = document.createElement("span");
  grow.className = "grow";
  head.appendChild(grow);

  if(c.entries.length){
    const cnt = document.createElement("span");
    cnt.className = "count" + (c.entries.length>=CAP ? " full" : "");
    cnt.textContent = c.entries.length + "/" + CAP;
    head.appendChild(cnt);
  }

  if(c.entries.length < CAP){
    const add = document.createElement("button");
    add.className = "icon add"; add.textContent = "+"; add.title = "Add someone to " + chLabel(i);
    add.onclick = () => { editing = {ch:i,id:"new"}; render() };
    head.appendChild(add);
  }
  el.appendChild(head);

  if(c.entries.length){
    const rows = document.createElement("div");
    rows.className = "rows";
    c.entries.forEach(en => rows.appendChild(row(en,i)));
    if(picked && picked.group && picked.ch === i) rows.querySelectorAll(".row").forEach(r => r.classList.add("picked"));
    el.appendChild(rows);
  }

  if(c.entries.length){
    const mv = document.createElement("button");
    mv.className = "movebar";
    mv.innerHTML = chevron("right");
    mv.title = "Projected burns — where this channel could go next";
    mv.onclick = e => { e.stopPropagation(); openNextMenu(mv, i); };
    el.appendChild(mv);
  }

  if(editing && editing.ch===i && editing.id==="new"){
    const box = document.createElement("div");
    box.className = "newrow";
    const inp = document.createElement("input");
    inp.placeholder = "name, then Enter";
    inp.maxLength = 24;
    inp.onblur = () => {
      const v = inp.value.trim();
      editing = null;
      if(v) send({type:"add",ch:i,name:v}); else { flush(); render() }
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ editing=null; flush(); render() }
    };
    box.appendChild(inp); el.appendChild(box);
    setTimeout(()=>inp.focus(),0);
  }

  if(pickedPerson || (picked && picked.ch !== i)) el.classList.add("target");
  el.onclick = e => {
    if(e.target.closest("button") || e.target.closest("input")) return;
    if(pickedPerson){
      send({ type:"assign", ch:i, pid:pickedPerson });
      pickedPerson = null;
      renderBench();
      return;
    }
    if(!picked || picked.ch === i) return;
    if(picked.group) send({type:"moveGroup", from:picked.ch, to:i});
    else send({type:"moveUser", from:picked.ch, to:i, id:picked.id});
    picked = null;
  };

  if(c.entries.length >= CAP){
    const ring = document.createElement("div");
    ring.className = "firering";
    el.appendChild(ring);
  }

  el.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect="move"; el.classList.add("drop") };
  el.ondragleave = () => el.classList.remove("drop");
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove("drop");
    let d; try{ d = JSON.parse(e.dataTransfer.getData("text/plain")) }catch(err){ return }
    if(!d) return;
    if(d.kind === "person"){ send({ type:"assign", ch:i, pid:d.pid }); return; }
    if(d.from === i) return;
    if(d.kind === "group") send({type:"moveGroup",from:d.from,to:i});
    else send({type:"moveUser",from:d.from,to:i,id:d.id});
  };
  return el;
}

function row(en,ci){
  const r = document.createElement("div");
  r.className = "row";

  const col = en.pid ? colorOf[en.pid] : null;
  const ink = col ? inkOn(col) : null;
  const lit = col ? glowInk(col) : null;
  if(col){
    const [a, b, c2] = auraRamp(col);
    r.classList.add("tinted");
    r.style.setProperty("--a1", rgba(a, .30));
    r.style.setProperty("--a2", rgba(b, .13));
    r.style.setProperty("--a3", rgba(c2, .28));
    r.style.setProperty("--e1", rgba(a, .9));
    r.style.setProperty("--e2", rgba(glowInk(b), .95));
    r.style.setProperty("--e3", rgba(c2, .9));
    r.style.setProperty("--glow", rgba(lit, .5));
    r.style.setProperty("--ink",  lit);
  }

  if(editing && editing.ch===ci && editing.id===en.id){
    const inp = document.createElement("input");
    inp.value = en.name; inp.maxLength = 24;
    inp.onblur = () => {
      const v = inp.value.trim();
      editing = null;
      if(v && v !== en.name) send({type:"rename",ch:ci,id:en.id,name:v});
      else { flush(); render() }
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ editing=null; flush(); render() }
    };
    r.appendChild(inp);
    setTimeout(()=>{inp.focus();inp.select()},0);
  } else {
    const who = document.createElement("span");
    who.className = "who"; who.textContent = en.name;
    if(lit) who.style.color = lit;
    who.draggable = true; who.title = "Drag to another channel";
    who.ondragstart = e => {
      e.stopPropagation();
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"user",from:ci,id:en.id}));
      r.classList.add("dragging");
    };
    who.ondragend = () => r.classList.remove("dragging");
    who.onclick = e => {
      e.stopPropagation();
      picked = (picked && picked.id === en.id) ? null : {ch:ci, id:en.id};
      render();
    };
    if(picked && picked.id === en.id) r.classList.add("picked");
    r.appendChild(who);
  }

  const clock = document.createElement("span");
  clock.className = "clock"; clock.dataset.at = en.at; clock.textContent = elapsed(en.at);
  if(lit){ clock.style.color = lit; clock.style.opacity = ".9" }
  if(Date.now()-en.at > 90*60000) clock.classList.add("stale");
  clock.title = "Click to reset the timer";
  clock.onclick = () => send({type:"timer",ch:ci,id:en.id});
  r.appendChild(clock);

  const ed = document.createElement("button");
  ed.className = "icon edit"; ed.innerHTML = pencilSVG(); ed.title = "Rename";
  if(lit){ ed.style.color = lit; ed.style.borderColor = rgba(lit, .45); ed.style.background = "transparent"; }
  ed.onclick = () => { editing = {ch:ci,id:en.id}; render() };
  r.appendChild(ed);

  const dl = document.createElement("button");
  dl.className = "icon del"; dl.innerHTML = crossSVG(); dl.title = "Remove";
  if(lit){ dl.style.color = lit; dl.style.borderColor = rgba(lit, .45); dl.style.background = "transparent"; }
  dl.onclick = () => send({type:"remove",ch:ci,id:en.id});
  r.appendChild(dl);
  return r;
}

/* ---------------- burning % popover ---------------- */
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null } }

function openPctMenu(anchor, ci){
  closeMenu();
  const m = document.createElement("div");
  m.className = "pctmenu";
  m.onclick = e => e.stopPropagation();

  const h = document.createElement("h4");
  h.textContent = "BURNING %";
  m.appendChild(h);

  const hint = document.createElement("div");
  hint.className = "pcthint";
  hint.textContent = "tap the same number to re-confirm it";
  m.appendChild(hint);

  const g = document.createElement("div");
  g.className = "pctgrid";
  for(let v=0; v<=100; v+=10){
    const b = document.createElement("button");
    b.textContent = v + "%";
    const col = pctColor(v);
    b.style.color = col; b.style.background = col+"20"; b.style.border = "1px solid "+col+"59";
    const current = v === board[ci].pct;
    if(current){
      b.setAttribute("aria-current","true");
      b.title = "Still " + v + "% — click to confirm and restart the clock";
    }
    b.onclick = () => {
      closeMenu();
      send({type:"pct",ch:ci,pct:v});
      toast(current
        ? chLabel(ci) + " confirmed still " + v + "%"
        : chLabel(ci) + " set to " + v + "%");
    };
    g.appendChild(b);
  }
  m.appendChild(g);
  document.body.appendChild(m);

  const r = anchor.getBoundingClientRect();
  let left = Math.min(r.left, window.innerWidth - m.offsetWidth - 12);
  let top = r.bottom + 8;
  if(top + m.offsetHeight > window.innerHeight - 10) top = Math.max(10, r.top - m.offsetHeight - 8);
  m.style.left = Math.max(10,left) + "px";
  m.style.top = top + "px";
  menuEl = m;
}
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  closeMenu();
  if(pickedPerson){ pickedPerson = null; renderBench(); render(); }
  if(picked){ picked = null; render() }
});
window.addEventListener("resize", closeMenu);
window.addEventListener("scroll", e => {
  // scrolling inside the popover itself shouldn't dismiss it
  if(menuEl && e.target instanceof Node && menuEl.contains(e.target)) return;
  closeMenu();
}, true);

/* ---------------- chat ---------------- */
const logEl = document.getElementById("log");
const chatEl = document.getElementById("chatLog");

function paintLog(el, items, emptyMsg){
  if(!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = "";
  if(!items.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = emptyMsg;
    el.appendChild(e);
    return;
  }
  items.forEach(item => {
    const line = document.createElement("div");
    line.innerHTML = '<span class="t"></span> <span class="src"></span> <span class="sep">:</span> <span class="msg"></span>';
    line.querySelector(".t").textContent = "[" + stamp(item.t) + "]";
    const src = line.querySelector(".src");
    src.textContent = item.who ? item.who : region + " System";
    if(item.who){
      src.classList.add("user");
      const col = colorByName[item.who.trim().toLowerCase()];
      if(col) src.style.color = col;
    }
    const msgEl = line.querySelector(".msg");
    if(item.who) msgEl.appendChild(messageNodes(item.msg));
    else msgEl.textContent = item.msg;
    el.appendChild(line);
  });
  if(atBottom) el.scrollTop = el.scrollHeight;
}

function renderLog(){
  // left: what happened on this region. right: chat, shared across all of them
  paintLog(logEl,  log.filter(x => !x.who), "No changes yet. Every board change shows up here.");
  paintLog(chatEl, chat, "No messages yet.");
}

const sayInput = document.getElementById("sayInput");
sayInput.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const v = sayInput.value.trim();
  if(!v) return;

  // "12 weenie" / "ch12 weenie" / "ch 12 weenie" -> add to that channel
  const quick = v.match(/^(?:ch\s*)?(\d{1,2})\s+(.{1,24})$/i);
  if(quick){
    const n = parseInt(quick[1], 10);
    const arg = quick[2].trim();

    // "12 70%" / "12 70" -> set the burning percentage
    const asPct = arg.match(/^(\d{1,3})\s*%?$/);
    if(asPct){
      const raw = parseInt(asPct[1], 10);
      if(n < 1 || n > board.length){ toast("No channel " + n + " — pick 1 to " + board.length, true); return; }
      if(raw > 100){ toast("Burning goes 0 to 100", true); return; }
      const v10 = Math.round(raw / 10) * 10;
      send({type:"pct", ch:n-1, pct:v10});
      sayInput.value = "";
      toast(chLabel(n-1) + " burning -> " + v10 + "%");
      return;
    }

    const name = arg;
    if(n >= 1 && n <= board.length){
      const c = board[n-1];
      const dupHere = c.entries.some(x => x.name.toLowerCase() === name.toLowerCase());
      if(c.entries.length >= CAP && !dupHere){
        toast(chLabel(n-1) + " is full (4/4)", true);
        return;
      }
      send({type:"add", ch:n-1, name});
      sayInput.value = "";
      toast(name + " → " + chLabel(n-1));
      return;
    }
    toast("No channel " + n + " — pick 1 to " + board.length, true);
    return;
  }

  socket.emit("chat", {who:me, text:v, region});
  sayInput.value = "";
});

const whoBtn = document.getElementById("whoBtn");
whoBtn.textContent = me;
whoBtn.onclick = () => {
  const v = prompt("Display name", me);
  if(v && v.trim()){
    me = v.trim().slice(0,24);

const mvpBtn = document.getElementById("mvpBtn");
mvpBtn.onclick = () => {

  mvpBtn.classList.add("fired");
  setTimeout(() => mvpBtn.classList.remove("fired"), 900);

const soundBtn = document.getElementById("soundBtn");
function paintSound(){ soundBtn.textContent = soundOn ? "🔊 alert: on" : "🔇 alert: off" }
paintSound();
soundBtn.onclick = () => {

  }
};

/* ---------------- 40 minute channel alert ----------------
   When someone on a channel hits the mark, only the people actually on that
   channel get the sound — everyone else hears nothing.
   -------------------------------------------------------------------------- */
const CHANNEL_ALERT_MINUTES = 40;
const ALERT_REGIONS = ["RD1", "RD2", "RD4"];   // GOB boards never chime
const alertedChannels = new Set();      // "REGION:index" while a channel is over
let timersPrimed = false;               // first pass just takes stock, silently

function onThisChannel(c){
  // claimed people first — survives nicknames, since it tracks the person not the text
  if(c.entries.some(e => e.pid && myIds.has(e.pid))) return true;
  // fall back to the display name for anyone typed in by hand
  const mine = me.trim().toLowerCase();
  if(!mine || mine === "guest") return false;
  return c.entries.some(e => e.name.trim().toLowerCase() === mine);
}

function checkChannelTimers(){
  const limit = CHANNEL_ALERT_MINUTES * 60000;
  const now = Date.now();
  const priming = !timersPrimed;
  Object.keys(boards).forEach(r => {
    if(!ALERT_REGIONS.includes(r)) return;
    (boards[r] || []).forEach((c, idx) => {
      const key = r + ":" + idx;
      const over = c.entries.some(e => now - e.at >= limit);

      if(!over){ alertedChannels.delete(key); return; }   // timers reset -> armed again
      if(alertedChannels.has(key)) return;
      alertedChannels.add(key);
      if(!timersPrimed) return;                           // already over when you opened the page
      if(!onThisChannel(c)) return;                       // not your channel, stay quiet

      const who = c.entries
        .filter(e => now - e.at >= limit)
        .map(e => e.name)
        .join(", ");
      const msg = r + " " + chLabel(idx) + " — " + CHANNEL_ALERT_MINUTES + "m up (" + who + ")";
      alarm();
      flashTitle(r + " " + chLabel(idx) + " " + CHANNEL_ALERT_MINUTES + "m");
      try {
        if(window.Notification && Notification.permission === "granted"){
          const n = new Notification(r + " — " + CHANNEL_ALERT_MINUTES + " minutes", {
            body: msg, requireInteraction: true
          });
          n.onclick = () => { window.focus(); stopFlash(); n.close(); };
        }
      } catch(e){}
      toast(msg);
    });
  });
  if(priming) timersPrimed = true;
}

/* Drop a background into public/img/ and it appears behind everything:
     bg.mp4  (or bg.webm)  — video, looped and muted
     bg.jpg  / bg.png / bg.webp / bg.gif — a still
   Nothing there? The cyberpunk layers carry on as they are. */
(function(){
  const vid = document.getElementById("bgVideo");
  const still = document.getElementById("bgStill");
  const videos = ["/img/bg.mp4", "/img/bg.webm"];
  const stills = ["/img/bg.jpg", "/img/bg.png", "/img/bg.webp", "/img/bg.gif"];

  const show = el => {
    el.style.display = "block";
    document.documentElement.classList.add("has-bg");
  };

  function tryStills(i){
    if(i >= stills.length) return;
    const probe = new Image();
    probe.onload = () => { still.style.backgroundImage = "url('" + stills[i] + "')"; show(still); };
    probe.onerror = () => tryStills(i + 1);
    probe.src = stills[i];
  }

  function tryVideos(i){
    if(i >= videos.length) return tryStills(0);
    vid.onloadeddata = () => show(vid);
    vid.onerror = () => tryVideos(i + 1);
    vid.src = videos[i];
    vid.load();
  }
  tryVideos(0);
})();

/* ---------------- clocks ---------------- */
setInterval(() => {
  document.getElementById("refreshed").textContent =
    new Date().toISOString().slice(11,19) + " UTC";
  checkChannelTimers();
  document.querySelectorAll(".ago").forEach(a => {
    const t = ago(+a.dataset.at);
    a.textContent = t.replace(" ago", "");
    a.title = "burning % last changed " + t;
  });
  document.querySelectorAll(".clock").forEach(c => {
    const at = +c.dataset.at;
    c.textContent = elapsed(at);
    c.classList.toggle("stale", Date.now()-at > 90*60000);
  });
}, 1000);
