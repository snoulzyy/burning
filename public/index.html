<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/img/crying.jpg">
<title>SHIDDAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Quicksand:wght@500;600;700&family=Poppins:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050a10;
    --panel:#0a1119;
    --panel-2:#0c141d;
    --raise:#101a25;
    --line:#18242f;
    --line-soft:#121d27;
    --dim:#5d7186;
    --label:#8ba0b4;
    --text:#dbe7f2;
    --cyan:#22d3ee;
    --green:#22c55e;
    --amber:#f59e0b;
    --red:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 520px at 50% -8%,rgba(34,211,238,.07),transparent 70%),
      linear-gradient(rgba(56,189,248,.032) 1px,transparent 1px),
      linear-gradient(90deg,rgba(56,189,248,.032) 1px,transparent 1px);
    background-size:auto,52px 52px,52px 52px;
  }
  .wrap{max-width:1560px;margin:0 auto;padding:26px 24px 80px}

  /* ---------------- header ---------------- */
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:26px}
  .logo{
    width:47px;height:47px;flex:none;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(160deg,#0d1b26,#0a1119);
    border:1px solid rgba(34,211,238,.3);
    box-shadow:0 0 30px rgba(34,211,238,.10) inset,0 6px 20px rgba(0,0,0,.4);
  }
  .logo svg{width:26px;height:26px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;font-size:29px;font-weight:800;letter-spacing:.02em;line-height:1}
  .status{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--green);flex-wrap:wrap}
  .status .sep{color:#2c3d4e}
  .status .who-online{color:var(--dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2.4s ease-in-out infinite}
  .dot.off{background:var(--red);box-shadow:0 0 9px var(--red)}
  @keyframes pulse{50%{opacity:.3}}
  .spacer{flex:1}

  .tabs{display:flex;gap:5px;padding:6px;border-radius:13px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
  .tab{
    font:inherit;font-size:12px;font-weight:600;letter-spacing:.07em;
    color:var(--dim);text-decoration:none;border-radius:8px;padding:8px 15px;
    background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;
    transition:color .15s,background .15s;
  }
  .tab:hover{color:var(--text);background:rgba(255,255,255,.035)}
  .tab[aria-current="page"]{background:var(--cyan);color:#04202a;font-weight:800}
  .tab.soon{color:#33465a;cursor:not-allowed;background:none}
  .tab.soon:hover{background:none;color:#33465a}

  /* ---------------- bench ---------------- */
  .bench{
    position:sticky;top:8px;z-index:30;
    margin-bottom:16px;background:rgba(10,17,25,.94);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .bench.armed{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 1px rgba(34,211,238,.25),0 10px 26px rgba(0,0,0,.5)}
  .bench-head{
    display:flex;align-items:center;gap:12px;padding:9px 13px;
    border-bottom:1px solid var(--line-soft);
  }
  .bench-title{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--cyan)}
  .bench-hint{font-size:10.5px;color:var(--dim)}
  .bench-add{margin-left:auto;font-size:11px;padding:5px 11px}
  .bench-body{
    display:flex;flex-wrap:nowrap;gap:7px;padding:11px 13px;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
  }
  .bench-body::-webkit-scrollbar{height:7px}
  .bench-body::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:7px}
  .bench-body::-webkit-scrollbar-track{background:transparent}
  .chip{flex:none}
  .bench-empty{font-size:11.5px;color:var(--dim);padding:2px 0}

  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 10px;
    border-radius:8px;border:1px solid var(--line);background:var(--raise);
    font-size:12.5px;cursor:grab;transition:.15s;
  }
  .chip:hover{border-color:#2d3f52}
  .chip:active{cursor:grabbing}
  .chip .nm{font-family:var(--name-face);font-weight:600}
  .chip.placed{opacity:.45;cursor:default}
  .chip.placed .where{font-size:10px;color:var(--amber);letter-spacing:.04em}
  .chip.mine{border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.08)}
  .chip.picked{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
  .chip-btn{
    width:18px;height:18px;flex:none;display:grid;place-items:center;padding:0;
    border-radius:5px;border:1px solid transparent;background:none;
    color:var(--dim);cursor:pointer;line-height:0;
  }
  .chip-btn svg{width:11px;height:11px;display:block}
  .chip-btn:hover{color:var(--text);border-color:var(--line)}
  .chip.mine .claim{color:var(--cyan)}
  .chip .drop-btn:hover{color:var(--red);border-color:rgba(239,68,68,.45)}
  @media(max-width:700px){.bench-hint{display:none}}

  /* ---------------- next up (floats over the board) ---------------- */
  .nextmenu{
    position:fixed;z-index:60;width:212px;padding:9px;border-radius:12px;
    background:#0a1119;border:1px solid #22303f;box-shadow:0 18px 44px rgba(0,0,0,.7);
  }
  .nextmenu h4{margin:0 0 7px;font:inherit;font-size:9.5px;font-weight:500;letter-spacing:.16em;color:var(--dim)}
  .next-body{
    display:flex;flex-direction:column;max-height:300px;overflow-y:auto;overscroll-behavior:contain;
  }
  .next-body::-webkit-scrollbar{width:7px}
  .next-body::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:7px}
  .next-body::-webkit-scrollbar{width:7px}
  .next-body::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:7px}
  .next-row{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;
    background:none;border:1px solid transparent;cursor:pointer;font:inherit;text-align:left;
  }
  .next-row:hover{background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.3)}
  .next-row .n-ch{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text)}
  .next-row .n-pct{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px}
  .next-row .n-slots{margin-left:auto;font-size:10px;color:var(--dim)}
  .next-empty{padding:10px 9px;font-size:11px;color:var(--dim);line-height:1.5}
  .movebtn{
    width:20px;height:20px;flex:none;display:grid;place-items:center;padding:0;
    border-radius:5px;border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.08);
    color:var(--cyan);cursor:pointer;line-height:0;transition:.15s;
  }
  .movebtn:hover{background:rgba(34,211,238,.2);border-color:var(--cyan)}
  .movebtn svg{width:12px;height:12px;display:block}
  .ch.flash{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(34,211,238,.5)}

/* ---------------- board ---------------- */
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  @media(max-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:940px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
  @media(max-width:360px){.grid{grid-template-columns:1fr}}

  .ch{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:10px;min-height:92px;
    display:flex;flex-direction:column;
    transition:border-color .16s,box-shadow .16s,transform .16s;
  }
  .ch:hover{border-color:#243546}
  .ch.occupied{border-color:rgba(34,211,238,.5);box-shadow:0 0 26px rgba(34,211,238,.09)}
  .ch.full{border-color:rgba(239,68,68,.6);box-shadow:0 0 26px rgba(239,68,68,.10)}
  .ch.drop{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);transform:translateY(-2px)}
  .ch.dragging{opacity:.35}

  .ch-head{
    display:flex;align-items:center;gap:9px;padding:10px 11px 9px;
    border-bottom:1px solid transparent;
  }
  .ch.occupied .ch-head,.ch.full .ch-head{border-bottom-color:var(--line-soft)}
  .handle{
    display:grid;place-items:center;width:15px;height:22px;flex:none;
    color:var(--amber);opacity:.8;cursor:grab;user-select:none;transition:opacity .15s;
  }
  .handle:hover{opacity:1}
  .handle svg{width:11px;height:17px;display:block}
  .handle:active{cursor:grabbing}
  .ch-name{font-size:12.5px;font-weight:700;letter-spacing:.1em;color:var(--label)}
  .ch.occupied .ch-name,.ch.full .ch-name{color:#fff}

  .pct{
    font:inherit;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;
    cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.05);
  }
  .pct:hover{filter:brightness(1.35)}
  .count{font-size:11px;font-weight:700;color:var(--dim);flex:none}
  .logfilter{display:inline-flex;gap:3px;margin-left:12px}
  .logfilter button{
    font:inherit;font-size:10px;font-weight:600;letter-spacing:.08em;
    color:var(--dim);background:none;border:1px solid transparent;
    border-radius:6px;padding:3px 9px;cursor:pointer;transition:.15s;
  }
  .logfilter button:hover{color:var(--text);background:rgba(255,255,255,.04)}
  .logfilter button[aria-pressed="true"]{
    color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.10);
  }
  @media(max-width:700px){.tip{display:none}}
  .tip{margin-left:auto;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--dim);white-space:nowrap;flex:none}
  .tip code{color:var(--cyan);font-size:10.5px}
  .toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;
    padding:9px 15px;border-radius:999px;background:#0a1119;color:var(--text);
    border:1px solid rgba(34,211,238,.6);font-size:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.7);max-width:calc(100% - 24px);
  }
  .toast.warn{border-color:rgba(239,68,68,.7)}
  .ago{font-size:11px;font-weight:600;color:var(--amber);white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1 1 auto;min-width:0}
  .count.full{color:var(--red)}

  .icon{
    width:20px;height:20px;flex:none;display:grid;place-items:center;padding:0;
    font:inherit;font-size:11.5px;line-height:0;cursor:pointer;border-radius:6px;
    border:1px solid var(--line);background:var(--raise);color:var(--dim);transition:.15s;
  }
  .icon:hover{color:var(--text);border-color:#2d3f52}
  .icon svg{width:12px;height:12px;display:block}
  .add{width:22px;height:22px;font-size:14px;line-height:1;flex:none;padding:0 0 1px}
  .add:hover{color:var(--cyan);border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.08)}
  .edit{border-color:rgba(34,211,238,.3);color:var(--cyan)}
  .edit:hover{background:rgba(34,211,238,.14);border-color:var(--cyan)}
  .del{border-color:rgba(239,68,68,.3);color:var(--red)}
  .del:hover{background:rgba(239,68,68,.14);border-color:var(--red)}

  .rows{padding:7px 8px 9px;display:flex;flex-direction:column;gap:5px}
  .row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;background:rgba(255,255,255,.03)}
  .row:hover{background:rgba(255,255,255,.055)}
  .row.dragging{opacity:.3}
  .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:var(--name-face);font-weight:600;font-size:13.5px;letter-spacing:.005em;cursor:grab}
  .clock{font-size:11px;font-weight:600;color:var(--amber);cursor:pointer}
  .clock.stale{color:var(--red)}
  .row input,.newrow input{
    font-family:var(--name-face);font-weight:600;font-size:13.5px;
    color:var(--text);background:#04121a;
    border:1px solid var(--cyan);border-radius:5px;padding:4px 7px;
  }
  .row input{flex:1;min-width:0}
  .newrow{padding:0 8px 9px}
  .newrow input{width:100%}
  .newrow input::placeholder{color:#3f556a}

  /* ---------------- burning % popover ---------------- */
  .pctmenu{
    position:fixed;z-index:60;padding:12px;border-radius:12px;
    background:#0a1119;border:1px solid #22303f;box-shadow:0 18px 44px rgba(0,0,0,.7);
  }
  .pctmenu h4{margin:0 0 9px;font:inherit;font-size:10px;font-weight:500;letter-spacing:.18em;color:var(--dim)}
  .pctgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .pctgrid button{font:inherit;font-size:12px;font-weight:800;padding:8px 6px;border-radius:7px;cursor:pointer;min-width:50px}
  .pctgrid button:hover{filter:brightness(1.4)}
  .pctgrid button[aria-current="true"]{box-shadow:0 0 0 1.5px currentColor inset}

  /* ---------------- chat ---------------- */
  .chat{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panes{display:grid;grid-template-columns:1.75fr 1fr}
  .pane{display:flex;flex-direction:column;min-width:0}
  .pane-chat{border-left:1px solid var(--line-soft)}
  .pane-head{
    display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line-soft);
    font-size:12.5px;font-weight:800;letter-spacing:.14em;color:var(--cyan);
  }
  .pane-chat .pane-head{color:var(--green)}
  @media(max-width:820px){
    .panes{grid-template-columns:1fr}
    .pane-chat{border-left:0;border-top:1px solid var(--line-soft)}
  }
  .log{height:clamp(120px,19vh,190px);overflow-y:auto;padding:11px 14px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;line-height:1.55}
  .log::-webkit-scrollbar{width:9px}
  .log::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:9px}
  .log .t{color:#42566a}
  .log .src{color:var(--cyan);font-weight:700}
  .log .src.user{color:var(--green)}
  .log .sep{color:#3a4c5e}
  .log .msg{color:#a9bcce}
  .log .empty{color:var(--dim)}
  .emote-btn{
    font:inherit;font-size:15px;line-height:1;flex:none;width:26px;height:26px;
    display:grid;place-items:center;cursor:pointer;border-radius:6px;
    border:1px solid var(--line);background:var(--raise);color:var(--dim);transition:.15s;
  }
  .emote-btn:hover{color:var(--amber);border-color:rgba(245,158,11,.5)}
  .emote-btn[hidden]{display:none}
  .picker{
    position:fixed;z-index:85;width:min(330px,calc(100vw - 24px));
    background:#0a1119;border:1px solid #22303f;border-radius:12px;
    box-shadow:0 18px 44px rgba(0,0,0,.7);overflow:hidden;
  }
  .picker-search{padding:9px 10px;border-bottom:1px solid var(--line-soft)}
  .picker-search input{
    width:100%;font:inherit;font-size:12px;color:var(--text);background:#04121a;
    border:1px solid var(--line);border-radius:6px;padding:6px 9px;
  }
  .picker-search input:focus{outline:none;border-color:var(--cyan)}
  .picker-grid{
    max-height:250px;overflow-y:auto;padding:8px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;
  }
  .picker-grid::-webkit-scrollbar{width:8px}
  .picker-grid::-webkit-scrollbar-thumb{background:#1c2a38;border-radius:8px}
  .picker-grid button{
    display:grid;place-items:center;height:44px;padding:2px;cursor:pointer;
    background:none;border:1px solid transparent;border-radius:7px;
  }
  .picker-grid button:hover{background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.35)}
  .picker-grid img{max-width:34px;max-height:34px}
  .picker-none{padding:14px 12px;font-size:11.5px;color:var(--dim);text-align:center}
  .emote{height:24px;vertical-align:middle;margin:-2px 1px 0}
  .emote.big{height:40px}
  .say{display:flex;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--panel-2)}
  .who-btn{font:inherit;font-size:13px;font-weight:800;color:var(--cyan);background:none;border:0;padding:0;cursor:pointer}
  .who-btn:hover{text-decoration:underline}
  .say input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--text);background:none;border:0;padding:3px 0}
  .say input::placeholder{color:#3f556a}
  .say input:focus{outline:none}

  /* ---------- stickers ---------- */
  .wrap{position:relative;z-index:1}
  .sticker{display:block;pointer-events:none;user-select:none}
  .sticker-row{display:inline-flex;align-items:flex-end;gap:6px;vertical-align:middle;flex-wrap:wrap}
  .sticker-row .sticker{opacity:.95}
  .sticker-layer{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
  .sticker-layer .sticker{position:absolute;animation:bob 7s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px)}}
  /* only once there's real empty margin beside the board */
  .sticker-layer{display:block}
  @media(max-width:820px){.sticker-row{display:none}}

  .help-btn{margin-right:10px}
  .modal{
    position:fixed;inset:0;z-index:90;display:grid;place-items:center;
    background:rgba(2,6,11,.72);padding:20px;
  }
  .modal-box{
    width:min(560px,100%);max-height:86vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.7);
  }
  .modal-head{
    display:flex;align-items:center;gap:10px;padding:15px 18px;
    border-bottom:1px solid var(--line-soft);
    font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--cyan);
  }
  .modal-body{padding:16px 18px 20px;font-size:12.5px;line-height:1.65;color:#a9bcce}
  .modal-body h5{
    margin:16px 0 7px;font-size:10.5px;letter-spacing:.16em;color:var(--dim);font-weight:500;
  }
  .modal-body h5:first-child{margin-top:0}
  .modal-body p{margin:0 0 7px}
  .modal-body code{
    color:var(--cyan);background:rgba(34,211,238,.10);
    border:1px solid rgba(34,211,238,.22);border-radius:4px;padding:1px 5px;font-size:11.5px;
  }
  .modal-body .k{color:var(--text);font-weight:600}
  .modal-close{
    margin-left:auto;font:inherit;font-size:16px;line-height:1;color:var(--dim);
    background:none;border:0;cursor:pointer;padding:0 2px;
  }
  .modal-close:hover{color:var(--text)}
  footer{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .ghost{font:inherit;font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer}
  .ghost:hover{color:var(--text);border-color:#2d3f52}
  .ghost.danger:hover{color:var(--red);border-color:rgba(239,68,68,.5)}
  .row.picked{background:rgba(34,211,238,.16);box-shadow:inset 0 0 0 1px rgba(34,211,238,.55)}
  .ch.target{border-color:rgba(34,211,238,.45);cursor:pointer}
  .ch.target:hover{border-color:var(--cyan);background:rgba(34,211,238,.05)}
  .hint{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;
    display:flex;align-items:center;gap:10px;padding:9px 15px;border-radius:999px;
    background:#0a1119;border:1px solid rgba(34,211,238,.6);color:var(--text);
    font-size:12px;box-shadow:0 12px 34px rgba(0,0,0,.7);max-width:calc(100% - 24px);
  }
  .hint button{font:inherit;font-size:11.5px;color:var(--dim);background:none;border:0;cursor:pointer;padding:0}
  .hint button:hover{color:var(--text)}

  @media(max-width:700px){
    .wrap{padding:16px 12px 70px}
    header{gap:12px;margin-bottom:18px}
    h1{font-size:24px}
    .logo{width:40px;height:40px;border-radius:11px}
    .logo svg{width:21px;height:21px}

    .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;padding:5px;-webkit-overflow-scrolling:touch}

<script>

let regionList = [];

/* =========================================================================
   STICKERS  —  put image files in  public/img/  and list them below.
   Turn the dials: more copies, bigger, denser. They live in the margins
   beside the board and along the bottom, never over a channel.
   ========================================================================= */
const STICKER_FILES = ["char.png"];   // add more filenames to mix them up
const STICKER_PER_SIDE = 14;          // how many down each side
const STICKER_FOOTER   = 10;          // how many along the bottom strip
const STICKER_MIN = 46, STICKER_MAX = 108;   // size range in px
const STICKER_OPACITY = 0.9;

function chevron(dir){
  const d = dir === "left" ? "M14.5 5.5L9 12l5.5 6.5" : "M9.5 5.5L15 12l-5.5 6.5";
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="' + d + '"/></svg>';
}

function pencilSVG(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<path d="M15.2 4.6l4.2 4.2"/>'
    + '<path d="M4.5 19.5l1.1-4.1L16.1 4.9a1.5 1.5 0 0 1 2.1 0l1.4 1.4a1.5 1.5 0 0 1 0 2.1L9.1 18.9z"/>'
    + '</svg>';
}
function crossSVG(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="2.2" stroke-linecap="round">'
    + '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
}

function gripSVG(){
  let dots = "";
  [4, 11, 18].forEach(y => [3.5, 8.5].forEach(x => {
    dots += '<circle cx="' + x + '" cy="' + y + '" r="1.6" fill="currentColor"/>';
  }));
  return '<svg viewBox="0 0 12 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + dots + '</svg>';
}


function stickerImg(file, w){
  const el = document.createElement("img");
  el.className = "sticker";
  el.src = "/img/" + file;
  el.width = w;
  el.alt = "";
  el.onerror = () => el.remove();
  return el;
}
const pick = i => STICKER_FILES[i % STICKER_FILES.length];

function placeStickers(){
  const head  = document.getElementById("stickHead");
  const foot  = document.getElementById("stickFoot");
  const layer = document.getElementById("stickerLayer");
  [head, foot, layer].forEach(el => { if(el) el.innerHTML = "" });

  if(head) head.appendChild(stickerImg(pick(0), 40));

  // bottom strip, always visible
  if(foot){
    for(let i = 0; i < STICKER_FOOTER; i++){
      const w = 26 + (i % 4) * 7;
      const el = stickerImg(pick(i), w);
      el.style.transform = (i % 2 ? "scaleX(-1) " : "") + "rotate(" + ((i%3)-1)*7 + "deg)";
      foot.appendChild(el);
    }
  }

  if(!layer) return;
  // how much clear space is there either side of the 1560px board?
  const gutter = (window.innerWidth - 1560) / 2;
  if(gutter < 74) return;                       // too tight — skip the swarm
  const cap = Math.min(STICKER_MAX, gutter - 14);

  ["left","right"].forEach((side, sideIdx) => {
    for(let i = 0; i < STICKER_PER_SIDE; i++){
      const seed = i * 7 + sideIdx * 13;
      const w = Math.round(STICKER_MIN + ((seed * 37) % 100) / 100 * (cap - STICKER_MIN));
      const el = stickerImg(pick(seed), w);
      el.style.top = (1 + i * (97 / STICKER_PER_SIDE) + ((seed * 11) % 5)) + "%";
      const inset = 6 + ((seed * 23) % Math.max(1, Math.floor(gutter - w - 6)));
      el.style[side] = inset + "px";
      el.style.opacity = STICKER_OPACITY - ((seed * 17) % 25) / 100;
      el.style.transform = ((seed % 2) ? "scaleX(-1) " : "") + "rotate(" + (((seed * 13) % 15) - 7) + "deg)";
      el.style.animationDelay = ((seed * 29) % 60) / 10 + "s";
      el.style.animationDuration = (6 + (seed % 5)) + "s";
      layer.appendChild(el);
    }
  });
}
placeStickers();
let stickerTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(stickerTimer);
  stickerTimer = setTimeout(placeStickers, 250);
});

/* ---------------- helpers ---------------- */
// Colour ramps smoothly with the value: 0% red -> 50% yellow -> 100% green.
function pctColor(v){
  const pct = Math.max(0, Math.min(100, v));
  return hslHex(pct * 1.2, 0.82, 0.52);
}
function hslHex(h, s, l){
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - c/2;
  let r=0, g=0, b=0;
  if(h < 60)       { r=c; g=x; }
  else if(h < 120) { r=x; g=c; }
  else if(h < 180) { g=c; b=x; }
  else if(h < 240) { g=x; b=c; }
  else if(h < 300) { r=x; b=c; }
  else             { r=c; b=x; }
  const hex = n => Math.round((n + m) * 255).toString(16).padStart(2, "0");
  return "#" + hex(r) + hex(g) + hex(b);
}
const chLabel = i => "CH " + String(i+1).padStart(2,"0");
function ago(at){
  const m = Math.floor((Date.now()-at)/60000);
  if(m < 1)  return "just now";
  if(m < 60) return m + "m ago";
  const h = Math.floor(m/60);
  return h < 24 ? h + "h ago" : Math.floor(h/24) + "d ago";
}
function elapsed(at){
  const m = Math.max(0, Math.floor((Date.now()-at)/60000));
  return m<60 ? m+"m" : Math.floor(m/60)+"h"+String(m%60).padStart(2,"0")+"m";
}
function stamp(ts){
  const d = new Date(ts);
  return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0");
}
const send = a => socket.emit("action", Object.assign({by:me, region}, a));

/* =========================================================================
   7TV EMOTES
   -------------------------------------------------------------------------
   Paste your emote set id below and those emotes render in chat.
   Find it at 7tv.app -> your emote set -> the id is the last part of the URL:
     https://7tv.app/emote-sets/01H2ABCDEFGHJKMNPQRSTVWXYZ
                                 ^^^^^^^^^^^^^^^^^^^^^^^^^^ this bit
   Leave it empty and nothing changes.
   ========================================================================= */
const SEVENTV_SET = "01FW12Y4WG00023D6NVRA4DJAM";

const emotes = {};          // name -> image url
let emotesReady = false;

async function loadEmotes(){
  if(!SEVENTV_SET) return;
  try {
    const res = await fetch("https://7tv.io/v3/emote-sets/" + SEVENTV_SET);
    if(!res.ok) { console.warn("7TV: set not found (" + res.status + ")"); return; }
    const data = await res.json();
    (data.emotes || []).forEach(e => {
      const host = e.data && e.data.host;
      if(!host || !host.url) return;
      const files = host.files || [];
      const pick = files.find(f => f.name === "2x.webp")
                || files.find(f => f.name === "1x.webp")
                || files.find(f => /\.webp$/.test(f.name))
                || files[0];
      if(!pick) return;
      emotes[e.name] = (host.url.startsWith("//") ? "https:" : "") + host.url + "/" + pick.name;
    });
    emotesReady = Object.keys(emotes).length > 0;
    if(emotesReady){
      const btn = document.getElementById("emoteBtn");
      if(btn) btn.hidden = false;
      renderLog();
    }
  } catch(err){
    console.warn("7TV: could not load emotes", err);
  }
}
loadEmotes();

/* ---------------- emote picker ---------------- */
let pickerEl = null;

function closePicker(){ if(pickerEl){ pickerEl.remove(); pickerEl = null } }

function insertEmote(name){
  const inp = document.getElementById("sayInput");
  const cur = inp.value;
  inp.value = cur + (cur && !/\s$/.test(cur) ? " " : "") + name + " ";
  inp.focus();
}

function openPicker(){
  if(pickerEl){ closePicker(); return; }
  const btn = document.getElementById("emoteBtn");
  const box = document.createElement("div");
  box.className = "picker";
  box.onclick = e => e.stopPropagation();
  box.innerHTML = '<div class="picker-search">'
    + '<input type="text" placeholder="search emotes…" aria-label="Search emotes"></div>'
    + '<div class="picker-grid"></div>';

  const grid = box.querySelector(".picker-grid");
  const search = box.querySelector("input");
  const names = Object.keys(emotes).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

  function paint(filter){
    const q = (filter || "").toLowerCase();
    const show = q ? names.filter(n => n.toLowerCase().includes(q)) : names;
    grid.innerHTML = "";
    if(!show.length){
      const none = document.createElement("div");
      none.className = "picker-none";
      none.textContent = "nothing matches that";
      grid.appendChild(none);
      return;
    }
    show.forEach(n => {
      const b = document.createElement("button");
      b.title = n;
      const img = document.createElement("img");
      img.src = emotes[n]; img.alt = n; img.loading = "lazy";
      b.appendChild(img);
      b.onclick = () => insertEmote(n);
      grid.appendChild(b);
    });
  }
  paint("");
  search.oninput = () => paint(search.value);
  search.onkeydown = e => { if(e.key === "Escape") closePicker(); };

  document.body.appendChild(box);
  const r = btn.getBoundingClientRect();
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(10, Math.min(r.right - w, window.innerWidth - w - 10)) + "px";
  box.style.top = (r.top - h - 8 > 10 ? r.top - h - 8 : r.bottom + 8) + "px";
  pickerEl = box;
  search.focus();
}

document.addEventListener("click", closePicker);
document.addEventListener("keydown", e => { if(e.key === "Escape") closePicker(); });
window.addEventListener("resize", closePicker);

document.getElementById("emoteBtn").onclick = e => { e.stopPropagation(); openPicker(); };

// turns "hello PogU" into text + <img>, never using innerHTML on user text
function messageNodes(text){
  const frag = document.createDocumentFragment();
  if(!emotesReady){ frag.appendChild(document.createTextNode(text)); return frag; }
  const parts = text.split(/(\s+)/);
  const words = parts.filter(w => w.trim());
  const allEmotes = words.length > 0 && words.length <= 3 && words.every(w => emotes[w]);
  parts.forEach(w => {
    if(emotes[w]){
      const img = document.createElement("img");
      img.className = "emote" + (allEmotes ? " big" : "");
      img.src = emotes[w];
      img.alt = w;
      img.title = w;
      img.loading = "lazy";
      frag.appendChild(img);
    } else {
      frag.appendChild(document.createTextNode(w));
    }
  });
  return frag;
}

/* ---------------- help panel ---------------- */

/* ---------------- alert sound + tab flashing ---------------- */
let soundOn = true;
try { soundOn = localStorage.getItem("ct:sound") !== "off" } catch(e){}

let audioCtx = null;
function primeAudio(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
}
document.addEventListener("click", primeAudio, { once: true });

function beep(startAt){
  const notes = [880, 1174.7, 1568];
  notes.forEach((f, i) => {
    const t = startAt + i * 0.13;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "triangle";
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + 0.36);
  });
}
function alarm(){
  if(!soundOn) return;
  primeAudio();
  // a suspended context queues notes and dumps them all on the next click — skip instead
  if(!audioCtx || audioCtx.state !== "running") return;
  const now = audioCtx.currentTime;
  // three bursts, so it's hard to miss from across the room
  [0, 1.1, 2.2].forEach(off => beep(now + off));
}

let titleTimer = null, baseTitle = null;
function flashTitle(msg){
  if(baseTitle === null) baseTitle = document.title;
  
  clearInterval(titleTimer);
  let on = false;
  titleTimer = setInterval(() => {
    document.title = (on = !on) ? "🔔 " + msg : baseTitle;
  }, 900);
}
function stopFlash(){
  clearInterval(titleTimer);
  if(baseTitle !== null) document.title = baseTitle;
}
window.addEventListener("focus", stopFlash);

let toastTimer = null;
function toast(msg, warn){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  const t = document.createElement("div");
  t.className = "toast" + (warn ? " warn" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3200);
}

/* ---------------- socket ---------------- */
socket.on("connect", () => {
  document.getElementById("conn").classList.remove("off");
  document.getElementById("connText").textContent = "live";
  socket.emit("join", region);
});
socket.on("disconnect", () => {
  document.getElementById("conn").classList.add("off");
  document.getElementById("connText").textContent = "reconnecting…";
});
socket.on("denied", msg => { document.getElementById("connText").textContent = msg });

socket.on("hello", info => {
  region = info.region;
  regionList = info.regions;
  areaOf = {};
  info.regions.forEach(r => { if(r.area) areaOf[r.id] = r.area; });
  renderTabs();
  paintTitles();
});

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  regionList.forEach(r => {
    if(r.enabled){
      const b = document.createElement("button");
      b.className = "tab";
      b.textContent = r.id;
      if(r.id === region) b.setAttribute("aria-current","page");
      b.onclick = () => switchTo(r.id);
      tabs.appendChild(b);
    } else {
      const sp = document.createElement("span");
      sp.className = "tab soon"; sp.textContent = r.id; sp.title = "Not open yet";
      tabs.appendChild(sp);
    }
  });
}

function paintTitles(){
  document.getElementById("title").textContent = region;
  document.getElementById("logTitle").textContent = region + " ACTIVITY";
  baseTitle = "SHIDDAS";
  if(!titleTimer) document.title = baseTitle;
}

// everything is already in memory, so this is instant
function switchTo(id, skipHistory){
  if(id === region) return;
  region = id;
  editing = null; picked = null; pending = null;
  closeMenu();
  board = boards[region] || [];
  log = logs[region] || [];
  socket.emit("view", region);
  if(!skipHistory) history.pushState({ region }, "", "/" + region.toLowerCase());
  renderTabs();
  paintTitles();
  paintPresence();
  render();
  document.querySelector(".wrap").scrollIntoView({ block: "start" });
}

window.addEventListener("popstate", () => {
  const id = decodeURIComponent(location.pathname.replace(/^\/|\/$/g, "")).toUpperCase();
  if(id && id !== region && regionList.some(r => r.enabled && r.id === id)) switchTo(id, true);
});

socket.on("roster", obj => {
  rosters = (obj && typeof obj === "object") ? obj : {};
  renderBench();
});

socket.on("chatlog", arr => {
  chat = Array.isArray(arr) ? arr : [];
  renderLog();
});

let onlineCount = 0;   // everyone on the site, whichever region they're on
socket.on("presence", p => {
  onlineCount = (p && typeof p.n === "number") ? p.n : 0;
  paintPresence();
});
function paintPresence(){
  document.getElementById("online").textContent = onlineCount + " watching";
}

socket.on("sync", s => {
  const r = s.region || region;
  boards[r] = s.channels;
  logs[r] = s.log;
  if(r !== region) return;                  // background region, nothing to redraw
  if(editing){ pending = s; return; }
  board = boards[r]; log = logs[r];
  render();
});

function flush(){ if(pending){ board = pending.channels; log = pending.log; pending = null } }

/* ---------------- next up ----------------
   Channels worth moving to: must have room, ranked by burning % first,
   emptier ones ahead of busier ones at the same percentage.
   -------------------------------------------------------------------------- */
const NEXT_COUNT = 8;

function rankChannels(skipIdx){
  return board
    .map((c, idx) => ({ idx, pct: c.pct, taken: c.entries.length }))
    .filter(c => c.taken < CAP && c.idx !== skipIdx)
    .sort((a, b) => (b.pct - a.pct) || (a.taken - b.taken) || (a.idx - b.idx))
    .slice(0, NEXT_COUNT);
}

function openNextMenu(anchor, fromIdx){
  closeMenu();
  const picks = rankChannels(fromIdx);

  const m = document.createElement("div");
  m.className = "nextmenu";
  m.onclick = e => e.stopPropagation();

  const h = document.createElement("h4");
  h.textContent = "MOVE TO";
  m.appendChild(h);

  const body = document.createElement("div");
  body.className = "next-body";

  if(!picks.length){
    const e = document.createElement("div");
    e.className = "next-empty";
    e.textContent = "Nowhere with room right now.";
    body.appendChild(e);
  } else {
    picks.forEach(c => {
      const row = document.createElement("button");
      row.className = "next-row";
      row.title = "Move everyone on " + chLabel(fromIdx) + " to " + chLabel(c.idx);

      const nm = document.createElement("span");
      nm.className = "n-ch";
      nm.textContent = chLabel(c.idx);
      row.appendChild(nm);

      const pct = document.createElement("span");
      pct.className = "n-pct";
      const col = pctColor(c.pct);
      pct.textContent = c.pct + "%";
      pct.style.color = col; pct.style.background = col + "20"; pct.style.border = "1px solid " + col + "55";
      row.appendChild(pct);

      const slots = document.createElement("span");
      slots.className = "n-slots";
      slots.textContent = c.taken === 0 ? "empty" : c.taken + "/" + CAP;
      row.appendChild(slots);

      row.onclick = () => {
        closeMenu();
        send({ type:"moveGroup", from: fromIdx, to: c.idx });
      };
      body.appendChild(row);
    });
  }

  m.appendChild(body);
  document.body.appendChild(m);

  const r = anchor.getBoundingClientRect();
  const w = m.offsetWidth, hh = m.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 10);
  let top = r.bottom + 6;
  if(top + hh > window.innerHeight - 8) top = Math.max(8, r.top - hh - 6);
  m.style.left = Math.max(8, left) + "px";
  m.style.top = top + "px";
  menuEl = m;
}

/* ---------------- the bench ---------------- */
const benchEl = document.getElementById("bench");

// where is this person right now, across every region?
const myArea = () => areaOf[region] || "RD";
const regionsHere = () => Object.keys(boards).filter(r => areaOf[r] === myArea());

function placementOf(pid){
  for(const r of regionsHere()){
    const chans = boards[r] || [];
    for(let i = 0; i < chans.length; i++){
      if(chans[i].entries.some(e => e.pid === pid)) return { region: r, idx: i };
    }
  }
  return null;
}

function personSVG(){
  return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none"'
    + ' stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
    + '<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2"/></svg>';
}

function renderBench(){
  if(!benchEl) return;
  const roster = rosters[myArea()] || [];
  benchEl.innerHTML = "";
  document.querySelector(".bench-title").textContent = myArea() + " PEOPLE";
  if(!roster.length){
    const e = document.createElement("div");
    e.className = "bench-empty";
    e.textContent = "No one here yet — hit “add person” to put names in.";
    benchEl.appendChild(e);
    return;
  }

  roster.forEach(p => {
    const at = placementOf(p.id);
    const chip = document.createElement("div");
    chip.className = "chip"
      + (at ? " placed" : "")
      + (myIds.has(p.id) ? " mine" : "")
      + (pickedPerson === p.id ? " picked" : "");

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = p.name;
    chip.appendChild(nm);

    if(at){
      const w = document.createElement("span");
      w.className = "where";
      w.textContent = at.region + " " + chLabel(at.idx).replace("CH ", "CH");
      chip.appendChild(w);
    } else {
      chip.draggable = true;
      chip.ondragstart = ev => {
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setData("text/plain", JSON.stringify({ kind:"person", pid:p.id }));
      };
      chip.onclick = ev => {
        if(ev.target.closest("button")) return;
        pickedPerson = (pickedPerson === p.id) ? null : p.id;
        picked = null;
        renderBench(); render();
      };
    }

    // "this is me" — ties alerts for whatever channel they're on to this browser
    const claim = document.createElement("button");
    claim.className = "chip-btn claim";
    claim.innerHTML = personSVG();
    claim.title = myIds.has(p.id) ? "This is you — click to unset" : "Mark as you (for alerts)";
    claim.onclick = ev => {
      ev.stopPropagation();
      if(myIds.has(p.id)) myIds.delete(p.id); else {
        myIds.add(p.id);
        try { if(window.Notification && Notification.permission === "default") Notification.requestPermission() } catch(e){}
      }
      saveMine(); renderBench();
    };
    chip.appendChild(claim);

    if(!at){
      const del = document.createElement("button");
      del.className = "chip-btn drop-btn";
      del.innerHTML = crossSVG();
      del.title = "Remove " + p.name + " from the list";
      del.onclick = ev => {
        ev.stopPropagation();
        if(confirm("Remove " + p.name + " from the people list?")){
          myIds.delete(p.id); saveMine();
          send({ type:"person-remove", id:p.id });
        }
      };
      chip.appendChild(del);
    }

    benchEl.appendChild(chip);
  });

  document.querySelector(".bench").classList.toggle("armed", !!pickedPerson);
  document.getElementById("benchHint").textContent = pickedPerson
    ? "now click the channel to put them on"
    : "click a name, then click a channel";
}

document.getElementById("benchAdd").onclick = () => {
  const v = prompt("Name to add");
  const name = (v || "").trim().slice(0,24);
  if(!name) return;
  if(name.toLowerCase() === "guest"){
    toast("“Guest” can't go in the people box — it's fine to just stay a guest", true);
    return;
  }
  send({ type:"person-add", name });
};

/* ---------------- board ---------------- */
const grid = document.getElementById("grid");

function render(){
  closeMenu();
  grid.innerHTML = "";
  board.forEach((c,i) => grid.appendChild(card(c,i)));
  const occ = board.filter(c=>c.entries.length).length;
  const ppl = board.reduce((n,c)=>n+c.entries.length,0);
  const full = board.filter(c=>c.entries.length>=CAP).length;
  document.getElementById("tally").textContent =
    `${occ}/${board.length} channels occupied · ${ppl} tracked · ${full} full`;
  renderLog();
  renderHint();
  renderBench();
}

function renderHint(){
  const old = document.querySelector(".hint");
  if(old) old.remove();
  if(!picked) return;
  const c = board[picked.ch];
  if(!c) { picked = null; return; }
  const who = picked.group
    ? chLabel(picked.ch) + " (" + c.entries.length + ")"
    : (c.entries.find(e => e.id === picked.id) || {}).name;
  if(!who) { picked = null; return; }
  const h = document.createElement("div");
  h.className = "hint";
  const label = document.createElement("span");
  label.textContent = "Moving " + who + " — tap a channel";
  const cancel = document.createElement("button");
  cancel.textContent = "cancel";
  cancel.onclick = () => { picked = null; render(); };
  h.appendChild(label); h.appendChild(cancel);
  document.body.appendChild(h);
}

function card(c,i){
  const el = document.createElement("div");
  el.className = "ch" + (c.entries.length>=CAP ? " full" : c.entries.length ? " occupied" : "")
;

  const head = document.createElement("div");
  head.className = "ch-head";

  if(c.entries.length){
    const h = document.createElement("span");
    h.className = "handle"; h.innerHTML = gripSVG(); h.title = "Drag the whole channel";
    h.draggable = true;
    h.ondragstart = e => {
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"group",from:i}));
      el.classList.add("dragging");
    };
    h.ondragend = () => el.classList.remove("dragging");
    h.onclick = e => {
      e.stopPropagation();
      picked = (picked && picked.group && picked.ch === i) ? null : {ch:i, group:true};
      render();
    };
    head.appendChild(h);
  }

  const nm = document.createElement("span");
  nm.className = "ch-name"; nm.textContent = chLabel(i);
  head.appendChild(nm);

  const p = document.createElement("button");
  p.className = "pct"; p.textContent = c.pct + "%"; p.title = "Set burning %";
  const col = pctColor(c.pct);
  p.style.color = col; p.style.background = col+"20"; p.style.borderColor = col+"55";
  p.onclick = e => { e.stopPropagation(); openPctMenu(p, i) };
  head.appendChild(p);

  if(c.entries.length){
    const mv = document.createElement("button");
    mv.className = "movebtn";
    mv.innerHTML = chevron("right");
    mv.title = "Move this channel somewhere better";
    mv.onclick = e => { e.stopPropagation(); openNextMenu(mv, i); };
    head.appendChild(mv);
  }

  if(c.pctAt){
    const t = document.createElement("span");
    t.className = "ago"; t.dataset.at = c.pctAt; t.textContent = ago(c.pctAt);
    t.title = "burning % last changed";
    head.appendChild(t);
  }

  const grow = document.createElement("span");
  grow.className = "grow";
  head.appendChild(grow);

  if(c.entries.length){
    const cnt = document.createElement("span");
    cnt.className = "count" + (c.entries.length>=CAP ? " full" : "");
    cnt.textContent = c.entries.length + "/" + CAP;
    head.appendChild(cnt);
  }

  if(c.entries.length < CAP){
    const add = document.createElement("button");
    add.className = "icon add"; add.textContent = "+"; add.title = "Add someone to " + chLabel(i);
    add.onclick = () => { editing = {ch:i,id:"new"}; render() };
    head.appendChild(add);
  }
  el.appendChild(head);

  if(c.entries.length){
    const rows = document.createElement("div");
    rows.className = "rows";
    c.entries.forEach(en => rows.appendChild(row(en,i)));
    if(picked && picked.group && picked.ch === i) rows.querySelectorAll(".row").forEach(r => r.classList.add("picked"));
    el.appendChild(rows);
  }

  if(editing && editing.ch===i && editing.id==="new"){
    const box = document.createElement("div");
    box.className = "newrow";
    const inp = document.createElement("input");
    inp.placeholder = "name, then Enter";
    inp.maxLength = 24;
    inp.onblur = () => {
      const v = inp.value.trim();
      editing = null;
      if(v) send({type:"add",ch:i,name:v}); else { flush(); render() }
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ editing=null; flush(); render() }
    };
    box.appendChild(inp); el.appendChild(box);
    setTimeout(()=>inp.focus(),0);
  }

  if(pickedPerson || (picked && picked.ch !== i)) el.classList.add("target");
  el.onclick = e => {
    if(e.target.closest("button") || e.target.closest("input")) return;
    if(pickedPerson){
      send({ type:"assign", ch:i, pid:pickedPerson });
      pickedPerson = null;
      renderBench();
      return;
    }
    if(!picked || picked.ch === i) return;
    if(picked.group) send({type:"moveGroup", from:picked.ch, to:i});
    else send({type:"moveUser", from:picked.ch, to:i, id:picked.id});
    picked = null;
  };

  el.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect="move"; el.classList.add("drop") };
  el.ondragleave = () => el.classList.remove("drop");
  el.ondrop = e => {
    e.preventDefault(); el.classList.remove("drop");
    let d; try{ d = JSON.parse(e.dataTransfer.getData("text/plain")) }catch(err){ return }
    if(!d) return;
    if(d.kind === "person"){ send({ type:"assign", ch:i, pid:d.pid }); return; }
    if(d.from === i) return;
    if(d.kind === "group") send({type:"moveGroup",from:d.from,to:i});
    else send({type:"moveUser",from:d.from,to:i,id:d.id});
  };
  return el;
}

function row(en,ci){
  const r = document.createElement("div");
  r.className = "row";

  if(editing && editing.ch===ci && editing.id===en.id){
    const inp = document.createElement("input");
    inp.value = en.name; inp.maxLength = 24;
    inp.onblur = () => {
      const v = inp.value.trim();
      editing = null;
      if(v && v !== en.name) send({type:"rename",ch:ci,id:en.id,name:v});
      else { flush(); render() }
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ editing=null; flush(); render() }
    };
    r.appendChild(inp);
    setTimeout(()=>{inp.focus();inp.select()},0);
  } else {
    const who = document.createElement("span");
    who.className = "who"; who.textContent = en.name;
    who.draggable = true; who.title = "Drag to another channel";
    who.ondragstart = e => {
      e.stopPropagation();
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", JSON.stringify({kind:"user",from:ci,id:en.id}));
      r.classList.add("dragging");
    };
    who.ondragend = () => r.classList.remove("dragging");
    who.onclick = e => {
      e.stopPropagation();
      picked = (picked && picked.id === en.id) ? null : {ch:ci, id:en.id};
      render();
    };
    if(picked && picked.id === en.id) r.classList.add("picked");
    r.appendChild(who);
  }

  const clock = document.createElement("span");
  clock.className = "clock"; clock.dataset.at = en.at; clock.textContent = elapsed(en.at);
  if(Date.now()-en.at > 90*60000) clock.classList.add("stale");
  clock.title = "Click to reset the timer";
  clock.onclick = () => send({type:"timer",ch:ci,id:en.id});
  r.appendChild(clock);

  const ed = document.createElement("button");
  ed.className = "icon edit"; ed.innerHTML = pencilSVG(); ed.title = "Rename";
  ed.onclick = () => { editing = {ch:ci,id:en.id}; render() };
  r.appendChild(ed);

  const dl = document.createElement("button");
  dl.className = "icon del"; dl.innerHTML = crossSVG(); dl.title = "Remove";
  dl.onclick = () => send({type:"remove",ch:ci,id:en.id});
  r.appendChild(dl);
  return r;
}

function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null } }

function openPctMenu(anchor, ci){
  closeMenu();
  const m = document.createElement("div");
  m.className = "pctmenu";
  m.onclick = e => e.stopPropagation();

  const h = document.createElement("h4");
  h.textContent = "BURNING %";
  m.appendChild(h);

  const g = document.createElement("div");

    const col = pctColor(v);

document.addEventListener("click", closeMenu);
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  closeMenu();
  if(pickedPerson){ pickedPerson = null; renderBench(); render(); }
  if(picked){ picked = null; render() }
});
window.addEventListener("resize", closeMenu);
window.addEventListener("scroll", e => {
  // scrolling inside the popover itself shouldn't dismiss it
  if(menuEl && e.target instanceof Node && menuEl.contains(e.target)) return;
  closeMenu();
}, true);

/* ---------------- chat ---------------- */
const logEl = document.getElementById("log");
const chatEl = document.getElementById("chatLog");

function paintLog(el, items, emptyMsg){
  if(!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
  el.innerHTML = "";
  if(!items.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = emptyMsg;
    el.appendChild(e);
    return;
  }
  items.forEach(item => {
    const line = document.createElement("div");
    line.innerHTML = '<span class="t"></span> <span class="src"></span> <span class="sep">:</span> <span class="msg"></span>';
    line.querySelector(".t").textContent = "[" + stamp(item.t) + "]";
    const src = line.querySelector(".src");
    src.textContent = item.who ? item.who : region + " System";
    if(item.who) src.classList.add("user");
    const msgEl = line.querySelector(".msg");
    if(item.who) msgEl.appendChild(messageNodes(item.msg));
    else msgEl.textContent = item.msg;
    el.appendChild(line);
  });
  if(atBottom) el.scrollTop = el.scrollHeight;
}

function renderLog(){
  // left: what happened on this region. right: chat, shared across all of them
  paintLog(logEl,  log.filter(x => !x.who), "No changes yet. Every board change shows up here.");
  paintLog(chatEl, chat, "No messages yet.");
}

const sayInput = document.getElementById("sayInput");
sayInput.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const v = sayInput.value.trim();
  if(!v) return;

  // "12 weenie" / "ch12 weenie" / "ch 12 weenie" -> add to that channel
  const quick = v.match(/^(?:ch\s*)?(\d{1,2})\s+(.{1,24})$/i);
  if(quick){
    const n = parseInt(quick[1], 10);
    const arg = quick[2].trim();

    // "12 70%" / "12 70" -> set the burning percentage
    const asPct = arg.match(/^(\d{1,3})\s*%?$/);
    if(asPct){
      const raw = parseInt(asPct[1], 10);
      if(n < 1 || n > board.length){ toast("No channel " + n + " — pick 1 to " + board.length, true); return; }
      if(raw > 100){ toast("Burning goes 0 to 100", true); return; }
      const v10 = Math.round(raw / 10) * 10;
      send({type:"pct", ch:n-1, pct:v10});
      sayInput.value = "";
      toast(chLabel(n-1) + " burning -> " + v10 + "%");
      return;
    }

    const name = arg;
    if(n >= 1 && n <= board.length){
      const c = board[n-1];
      const dupHere = c.entries.some(x => x.name.toLowerCase() === name.toLowerCase());
      if(c.entries.length >= CAP && !dupHere){
        toast(chLabel(n-1) + " is full (4/4)", true);
        return;
      }
      send({type:"add", ch:n-1, name});
      sayInput.value = "";
      toast(name + " → " + chLabel(n-1));
      return;
    }
    toast("No channel " + n + " — pick 1 to " + board.length, true);
    return;
  }

  socket.emit("chat", {who:me, text:v, region});
  sayInput.value = "";
});

/* ---------------- 40 minute channel alert ----------------
   When someone on a channel hits the mark, only the people actually on that
   channel get the sound — everyone else hears nothing.
   -------------------------------------------------------------------------- */
const CHANNEL_ALERT_MINUTES = 40;
const ALERT_REGIONS = ["RD1", "RD2", "RD4"];   // GOB boards never chime
const alertedChannels = new Set();      // "REGION:index" while a channel is over
let timersPrimed = false;               // first pass just takes stock, silently

function onThisChannel(c){
  // claimed people first — survives nicknames, since it tracks the person not the text
  if(c.entries.some(e => e.pid && myIds.has(e.pid))) return true;
  // fall back to the display name for anyone typed in by hand
  const mine = me.trim().toLowerCase();
  if(!mine || mine === "guest") return false;
  return c.entries.some(e => e.name.trim().toLowerCase() === mine);
}

function checkChannelTimers(){
  const limit = CHANNEL_ALERT_MINUTES * 60000;
  const now = Date.now();
  const priming = !timersPrimed;
  Object.keys(boards).forEach(r => {
    if(!ALERT_REGIONS.includes(r)) return;
    (boards[r] || []).forEach((c, idx) => {
      const key = r + ":" + idx;
      const over = c.entries.some(e => now - e.at >= limit);

      if(!over){ alertedChannels.delete(key); return; }   // timers reset -> armed again
      if(alertedChannels.has(key)) return;
      alertedChannels.add(key);
      if(!timersPrimed) return;                           // already over when you opened the page
      if(!onThisChannel(c)) return;                       // not your channel, stay quiet

      const who = c.entries
        .filter(e => now - e.at >= limit)
        .map(e => e.name)
        .join(", ");
      const msg = r + " " + chLabel(idx) + " — " + CHANNEL_ALERT_MINUTES + "m up (" + who + ")";
      alarm();
      flashTitle(r + " " + chLabel(idx) + " " + CHANNEL_ALERT_MINUTES + "m");
      try {
        if(window.Notification && Notification.permission === "granted"){
          const n = new Notification(r + " — " + CHANNEL_ALERT_MINUTES + " minutes", {
            body: msg, requireInteraction: true
          });
          n.onclick = () => { window.focus(); stopFlash(); n.close(); };
        }
      } catch(e){}
      toast(msg);
    });
  });
  if(priming) timersPrimed = true;
}

/* ---------------- clocks ---------------- */
setInterval(() => {
  document.getElementById("refreshed").textContent =
    new Date().toISOString().slice(11,19) + " UTC";
  checkChannelTimers();
  document.querySelectorAll(".ago").forEach(a => { a.textContent = ago(+a.dataset.at) });
  document.querySelectorAll(".clock").forEach(c => {
    const at = +c.dataset.at;
    c.textContent = elapsed(at);
    c.classList.toggle("stale", Date.now()-at > 90*60000);
  });
}, 1000);
</script>
